<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "b2bMode", "label": "B2B Mode", "type": "select", "options": ["Left", "Right", "Center"], "default": "Left" },
      { "id": "lineCount", "label": "ライン数", "type": "range", "min": 10, "max": 200, "step": 5, "default": 50 },
      { "id": "color", "label": "色", "type": "color", "default": "#ffffff" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.8 },
      { "id": "speed", "label": "速度", "type": "range", "min": 1, "max": 50, "step": 1, "default": 20 },
      { "id": "reactHigh", "label": "高音反応", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 2.0 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let params = { b2bMode: "Left", lineCount: 50, color: "#ffffff", opacity: 0.8, speed: 20, reactHigh: 2.0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    
    let lines = [];

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color', 'b2bMode'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function spawnLine() {
      const isLeft = params.b2bMode === "Left" || (params.b2bMode === "Center" && Math.random() > 0.5);
      lines.push({
        y: Math.random() * height,
        x: isLeft ? -100 : width+100,
        len: 50 + Math.random() * 200,
        vx: (isLeft ? 1 : -1) * (params.speed + Math.random()*20)
      });
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      time += 0.1;
      let highSum = 0;
      for (let i = 100; i < 200; i++) highSum += currentFFT[i];
      const high = (highSum / 100) / 255.0 || 0;
      
      if (lines.length < params.lineCount) spawnLine();
      if (high > 0.2 * (1/(params.reactHigh||0.001))) {
        for(let i=0; i<5; i++) spawnLine();
      }

      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = "lighter";
      
      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${params.opacity})`;
      ctx.lineWidth = 2 + high * 5;

      for (let i = lines.length - 1; i >= 0; i--) {
        const l = lines[i];
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        l.x += l.vx * (1 + high * params.reactHigh);
        ctx.lineTo(l.x - (l.vx>0?l.len:-l.len), l.y);
        ctx.stroke();
        
        if (l.x < -500 || l.x > width + 500) lines.splice(i, 1);
      }

      // B2B Mask
      if (params.b2bMode !== "Center") {
        ctx.globalCompositeOperation = "destination-in";
        const cx = width / 2;
        const sign = params.b2bMode === "Left" ? -1 : 1;
        const fadeWidth = 200;
        
        ctx.beginPath();
        if (params.b2bMode === "Left") ctx.rect(0, 0, cx - fadeWidth/2, height);
        else ctx.rect(cx + fadeWidth/2, 0, width, height);
        ctx.fillStyle = "rgba(255,255,255,1)";
        ctx.fill();

        for(let y=0; y<height; y+=5) {
          const wave = (Math.random()-0.5) * 100; // very sharp noise for speed lines
          const maskGrad = ctx.createLinearGradient(cx + wave, 0, cx + wave + (fadeWidth * sign), 0);
          maskGrad.addColorStop(0, "rgba(255,255,255,1)");
          maskGrad.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = maskGrad;
          ctx.fillRect(cx - fadeWidth - 100, y, fadeWidth*2 + 200, 6);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
