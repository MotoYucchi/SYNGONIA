<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "bassFreqLow", "label": "Bass Freq Low", "type": "range", "min": 0, "max": 50, "step": 1, "default": 0 },
    { "id": "bassFreqHigh", "label": "Bass Freq High", "type": "range", "min": 1, "max": 80, "step": 1, "default": 10 },
    { "id": "bassThreshold", "label": "Bass Threshold", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.1 },
    { "id": "bassSense", "label": "Bass Sensitivity", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 2.0 },
    { "id": "shakeAmount", "label": "Shake Amount", "type": "range", "min": 0, "max": 100, "step": 1, "default": 30 },
    { "id": "glitchSlice", "label": "Glitch Slice", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.5 },
    { "id": "rgbSplit", "label": "RGB Split", "type": "range", "min": 0, "max": 30, "step": 1, "default": 8 },
    { "id": "color", "label": "Base Color", "type": "color", "default": "#ff3333" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "mode", "label": "Mode", "type": "select", "options": ["Shake", "Glitch", "Both"], "default": "Both" },
    { "id": "hueSource", "label": "Hue Band", "type": "select", "options": ["None", "Low", "Mid", "High"], "default": "None" },
    { "id": "hueAmount", "label": "Hue Amount", "type": "range", "min": -360, "max": 360, "step": 1, "default": 90 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; cx = width/2; cy = height/2; }
window.addEventListener('resize', resize); resize();

let params = {
  bassFreqLow: 0, bassFreqHigh: 10, bassThreshold: 0.1, bassSense: 2.0,
  shakeAmount: 30, glitchSlice: 0.5, rgbSplit: 8,
  color: '#ff3333', opacity: 1.0, mode: 'Both',
  hueSource: 'None', hueAmount: 90, shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let smoothBass = 0;

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : { r:255,g:51,b:51 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color','mode','hueSource'].includes(msg.paramId) ? msg.value : Number(msg.value);
  } else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
  else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
});

function getBass() {
  const lo = Math.max(0, params.bassFreqLow), hi = Math.min(511, params.bassFreqHigh);
  if (hi <= lo) return 0;
  let s = 0; for (let i = lo; i <= hi; i++) s += currentFFT[i];
  return (s / (hi - lo + 1)) / 255;
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawBass = getBass();
  const bassActive = rawBass > params.bassThreshold
    ? (rawBass - params.bassThreshold) / (1 - params.bassThreshold) : 0;
  smoothBass += (bassActive - smoothBass) * 0.4;
  const bass = smoothBass * params.bassSense;

  ctx.clearRect(0, 0, width, height);

  // Hue
  let hv = 0;
  if (params.hueSource === 'Low') hv = rawBass;
  else if (params.hueSource === 'Mid') { let s=0; for(let i=20;i<=30;i++) s+=currentFFT[i]; hv=s/11/255; }
  else if (params.hueSource === 'High') { let s=0; for(let i=100;i<=120;i++) s+=currentFFT[i]; hv=s/21/255; }
  canvas.style.filter = hv ? `hue-rotate(${hv*params.hueAmount}deg)` : '';

  if (bassActive <= 0) { requestAnimationFrame(render); return; }

  const lRgb = hexToRgb(params.color);
  const r = Math.min(255, lRgb.r+groupColorRgb.r), g = Math.min(255, lRgb.g+groupColorRgb.g), b = Math.min(255, lRgb.b+groupColorRgb.b);
  const alpha = bassActive * params.opacity;

  ctx.save();
  ctx.translate((params.shiftX||0)/100*cx, (params.shiftY||0)/100*cy);

  // シェイクモード
  if (params.mode === 'Shake' || params.mode === 'Both') {
    const shakeX = (Math.random() - 0.5) * params.shakeAmount * bass;
    const shakeY = (Math.random() - 0.5) * params.shakeAmount * bass;

    // 画面枠の揺れ線
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth = 3 + bass * 5;
    ctx.shadowColor = `rgba(${r},${g},${b},${alpha*0.5})`;
    ctx.shadowBlur = bass * 15;

    // 四辺に揺れる線
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const pts = 30;
      for (let j = 0; j <= pts; j++) {
        const t = j / pts;
        let x, y;
        if (i === 0) { x = t * width; y = shakeY + Math.sin(t * 10 + Date.now()*0.01) * bass * 10; }
        else if (i === 1) { x = t * width; y = height + shakeY + Math.sin(t * 10 + Date.now()*0.01) * bass * 10; }
        else if (i === 2) { x = shakeX + Math.sin(t * 10 + Date.now()*0.01) * bass * 10; y = t * height; }
        else { x = width + shakeX + Math.sin(t * 10 + Date.now()*0.01) * bass * 10; y = t * height; }
        j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // グリッチスライスモード
  if (params.mode === 'Glitch' || params.mode === 'Both') {
    if (Math.random() < params.glitchSlice * bass) {
      const sliceCount = Math.floor(3 + bass * 8);
      for (let i = 0; i < sliceCount; i++) {
        const sy = Math.random() * height;
        const sh = Math.random() * 40 + 5;
        const offset = (Math.random() - 0.5) * params.rgbSplit * bass * 5;

        // RGB分離
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(${r},0,0,${alpha * 0.4})`;
        ctx.fillRect(offset, sy, width, sh);
        ctx.fillStyle = `rgba(0,${g},0,${alpha * 0.4})`;
        ctx.fillRect(-offset, sy + 2, width, sh);
        ctx.fillStyle = `rgba(0,0,${b},${alpha * 0.4})`;
        ctx.fillRect(offset * 0.5, sy - 2, width, sh);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
