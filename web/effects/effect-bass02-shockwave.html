<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "bassFreqLow", "label": "Bass Freq Low", "type": "range", "min": 0, "max": 50, "step": 1, "default": 0 },
    { "id": "bassFreqHigh", "label": "Bass Freq High", "type": "range", "min": 1, "max": 80, "step": 1, "default": 10 },
    { "id": "bassThreshold", "label": "Bass Threshold", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.15 },
    { "id": "bassSense", "label": "Bass Sensitivity", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.5 },
    { "id": "waveSpeed", "label": "Wave Speed", "type": "range", "min": 1, "max": 30, "step": 0.5, "default": 8 },
    { "id": "waveDecay", "label": "Wave Decay", "type": "range", "min": 0.005, "max": 0.05, "step": 0.001, "default": 0.015 },
    { "id": "maxRadius", "label": "Max Radius", "type": "range", "min": 100, "max": 1500, "step": 10, "default": 600 },
    { "id": "thickness", "label": "Line Thickness", "type": "range", "min": 1, "max": 20, "step": 0.5, "default": 4 },
    { "id": "cooldown", "label": "Hit Cooldown (ms)", "type": "range", "min": 50, "max": 500, "step": 10, "default": 100 },
    { "id": "color", "label": "Base Color", "type": "color", "default": "#00ccff" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "hueSource", "label": "Hue Band", "type": "select", "options": ["None", "Low", "Mid", "High"], "default": "None" },
    { "id": "hueAmount", "label": "Hue Amount", "type": "range", "min": -360, "max": 360, "step": 1, "default": 90 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; cx = width/2; cy = height/2; }
window.addEventListener('resize', resize); resize();

let params = {
  bassFreqLow: 0, bassFreqHigh: 10, bassThreshold: 0.15, bassSense: 1.5,
  waveSpeed: 8, waveDecay: 0.015, maxRadius: 600, thickness: 4, cooldown: 100,
  color: '#00ccff', opacity: 1.0, hueSource: 'None', hueAmount: 90,
  shiftX: 0, shiftY: 0, baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let waves = [], lastHitTime = 0, prevBassBelow = true;

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : { r:0,g:204,b:255 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color','hueSource'].includes(msg.paramId) ? msg.value : Number(msg.value);
  } else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
  else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
});

function getBass() {
  const lo = Math.max(0, params.bassFreqLow), hi = Math.min(511, params.bassFreqHigh);
  if (hi <= lo) return 0;
  let s = 0; for (let i = lo; i <= hi; i++) s += currentFFT[i];
  return (s / (hi - lo + 1)) / 255;
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawBass = getBass();
  const now = performance.now();
  const isAbove = rawBass > params.bassThreshold;
  if (isAbove && prevBassBelow && (now - lastHitTime) > params.cooldown) {
    waves.push({ radius: 0, alpha: 1.0, intensity: rawBass });
    lastHitTime = now;
  }
  prevBassBelow = !isAbove;

  ctx.clearRect(0, 0, width, height);

  // Hue
  let hv = 0;
  if (params.hueSource === 'Low') hv = rawBass;
  else if (params.hueSource === 'Mid') { let s=0; for(let i=20;i<=30;i++) s+=currentFFT[i]; hv=s/11/255; }
  else if (params.hueSource === 'High') { let s=0; for(let i=100;i<=120;i++) s+=currentFFT[i]; hv=s/21/255; }
  canvas.style.filter = hv ? `hue-rotate(${hv*params.hueAmount}deg)` : '';

  const lRgb = hexToRgb(params.color);
  const r = Math.min(255, lRgb.r+groupColorRgb.r), g = Math.min(255, lRgb.g+groupColorRgb.g), b = Math.min(255, lRgb.b+groupColorRgb.b);

  ctx.save();
  ctx.translate(cx + (params.shiftX||0)/100*cx, cy + (params.shiftY||0)/100*cy);

  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.radius += params.waveSpeed * (1 + w.intensity * params.bassSense);
    w.alpha -= params.waveDecay;
    if (w.alpha <= 0 || w.radius > params.maxRadius) { waves.splice(i, 1); continue; }

    const lw = params.thickness * (1 + w.intensity*2) * (1 - w.radius/params.maxRadius*0.5);
    ctx.strokeStyle = `rgba(${r},${g},${b},${w.alpha*params.opacity})`;
    ctx.lineWidth = lw;
    ctx.shadowColor = `rgba(${r},${g},${b},${w.alpha*0.6})`;
    ctx.shadowBlur = 15 + w.intensity*20;
    ctx.beginPath(); ctx.arc(0, 0, w.radius, 0, Math.PI*2); ctx.stroke();
    if (w.radius > 30) {
      ctx.strokeStyle = `rgba(${r},${g},${b},${w.alpha*params.opacity*0.3})`;
      ctx.lineWidth = lw*0.5;
      ctx.beginPath(); ctx.arc(0, 0, w.radius*0.7, 0, Math.PI*2); ctx.stroke();
    }
  }
  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
