<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "b2bMode", "label": "B2B Mode", "type": "select", "options": ["Left", "Right", "Center"], "default": "Left" },
      { "id": "laserCount", "label": "レーザー数", "type": "range", "min": 1, "max": 50, "step": 1, "default": 20 },
      { "id": "color", "label": "色", "type": "color", "default": "#ff0055" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.9 },
      { "id": "speed", "label": "速度", "type": "range", "min": 0, "max": 20, "step": 0.1, "default": 10.0 },
      { "id": "reactHigh", "label": "高音反応", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 2.0 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let params = { b2bMode: "Left", laserCount: 20, color: "#ff0055", opacity: 0.9, speed: 10.0, reactHigh: 2.0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    
    let lasers = [];

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color', 'b2bMode'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function spawnLaser() {
      const isLeft = params.b2bMode === "Left" || (params.b2bMode === "Center" && Math.random() > 0.5);
      lasers.push({
        y: Math.random() * height,
        x: isLeft ? 0 : width,
        vx: (isLeft ? 1 : -1) * (params.speed + Math.random()*10),
        life: 1.0
      });
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      time += 0.05;
      let highSum = 0;
      for (let i = 150; i < 200; i++) highSum += currentFFT[i];
      const high = (highSum / 50) / 255.0 || 0;
      
      if (high > 0.3 * (1/(params.reactHigh||0.001)) && Math.random() < 0.3) {
        for(let i=0; i<3; i++) spawnLaser();
      }

      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,0.1)";
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = "lighter";
      
      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      ctx.lineWidth = 3 + high * 10;
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${params.opacity})`;

      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        l.x += l.vx * (1 + high * params.reactHigh);
        ctx.lineTo(l.x, l.y);
        ctx.stroke();
        
        if (l.x < 0 || l.x > width) lasers.splice(i, 1);
      }

      // Add random horizontal lines
      if (lasers.length < params.laserCount && Math.random() < 0.1) spawnLaser();

      // B2B Mask
      if (params.b2bMode !== "Center") {
        ctx.globalCompositeOperation = "destination-in";
        const cx = width / 2;
        const sign = params.b2bMode === "Left" ? -1 : 1;
        const fadeWidth = 250;
        
        ctx.beginPath();
        if (params.b2bMode === "Left") ctx.rect(0, 0, cx - fadeWidth/2, height);
        else ctx.rect(cx + fadeWidth/2, 0, width, height);
        ctx.fillStyle = "rgba(255,255,255,1)";
        ctx.fill();

        for(let y=0; y<height; y+=10) {
          // Faster, jagged wave for clash
          const wave = Math.sin(y*0.1 + time*10) * 80 + (Math.random()-0.5)*50;
          const maskGrad = ctx.createLinearGradient(cx + wave, 0, cx + wave + (fadeWidth * sign), 0);
          maskGrad.addColorStop(0, "rgba(255,255,255,1)");
          maskGrad.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = maskGrad;
          ctx.fillRect(cx - fadeWidth - 100, y, fadeWidth*2 + 200, 11);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
