<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {
            "id": "mode",
            "label": "Utility Mode",
            "type": "select",
            "options": [
                  "Voronoi",
                  "Ribbon",
                  "DotWave",
                  "NoiseGlitch",
                  "FeedbackOnly"
            ],
            "default": "Voronoi"
      },
      {
            "id": "feedback",
            "label": "Afterimage (Feedback)",
            "type": "range",
            "min": 0,
            "max": 0.95,
            "step": 0.01,
            "default": 0.5
      },
      {
            "id": "opacity",
            "label": "Opacity",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 1.0
      },
      {
            "id": "speed",
            "label": "Movement Speed",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "color",
            "label": "Main Color",
            "type": "color",
            "default": "#ffffff"
      },
      {
            "id": "intensity",
            "label": "Effect Intensity",
            "type": "range",
            "min": 0,
            "max": 2,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "reactLow",
            "label": "Bass Sensitivity",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.5
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      },
      {
            "id": "shiftX",
            "label": "Shift X",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      },
      {
            "id": "shiftY",
            "label": "Shift Y",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      }
]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, cx, cy;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { mode: "Voronoi", feedback: 0.5, opacity: 1.0, speed: 1.0, color: "#ffffff", intensity: 1.0, reactLow: 1.5, hueSource: "None", hueAmount: 90, shiftX: 0, shiftY: 0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;

    // Voronoi用ポイント
    let points = Array.from({length: 15}, () => ({ x: Math.random(), y: Math.random(), vx: (Math.random()-0.5)*0.01, vy: (Math.random()-0.5)*0.01 }));

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    function calculateModColor(layerHex, gRgb, alpha = 1.0) {
      const lRgb = hexToRgb(layerHex);
      const r = (lRgb.r + gRgb.r) % 256;
      const g = (lRgb.g + gRgb.g) % 256;
      const b = (lRgb.b + gRgb.b) % 256;
      return `rgba(${r}, ${g}, ${b}, ${alpha * params.opacity})`;
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(draw);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        params[msg.paramId] = (['color', 'mode', 'hueSource'].includes(msg.paramId)) ? msg.value : Number(msg.value);
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    function draw() {
      if (!isVisible) { isAnimating = false; return; }
      const bass = (currentFFT[0] + currentFFT[1] + currentFFT[2]) / 3 / 255 || 0;
      const mid = currentFFT[32] / 255 || 0;
      time += params.speed * 0.01 * (1 + bass);

      // ★ フィードバック処理：destination-outを用いて透明キャンバスのピクセルを徐々に消去する
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = `rgba(0, 0, 0, ${1 - params.feedback})`;
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'source-over';

      ctx.save();
      const shiftOffsetX = (params.shiftX || 0) / 100 * cx;
      const shiftOffsetY = (params.shiftY || 0) / 100 * cy;
      ctx.translate(shiftOffsetX, shiftOffsetY);

      const mainColor = calculateModColor(params.color, groupColorRgb);
      ctx.strokeStyle = ctx.fillStyle = mainColor;

      switch(params.mode) {
        case "Voronoi":
          ctx.lineWidth = 1 + bass * 5;
          points.forEach(p => {
            p.x = (p.x + p.vx * params.speed) % 1; if(p.x < 0) p.x += 1;
            p.y = (p.y + p.vy * params.speed) % 1; if(p.y < 0) p.y += 1;
          });
          for(let i=0; i<width; i+=40) {
            for(let j=0; j<height; j+=40) {
              let minDist = 1000, secondMin = 1000;
              points.forEach(p => {
                const d = Math.hypot(i - p.x*width, j - p.y*height);
                if(d < minDist) { secondMin = minDist; minDist = d; }
                else if(d < secondMin) { secondMin = d; }
              });
              if(Math.abs(secondMin - minDist) < 2 * params.intensity) {
                ctx.fillRect(i, j, 2, 2);
              }
            }
          }
          break;

        case "Ribbon":
          ctx.beginPath();
          ctx.lineWidth = 2;
          for(let i=0; i<5; i++) {
            ctx.moveTo(0, height * 0.2 * i);
            for(let x=0; x<width; x+=10) {
              const y = height * 0.2 * i + Math.sin(x*0.005 + time + i) * 100 * bass * params.reactLow;
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
          break;

        case "DotWave":
          const spacing = 30;
          for(let x=spacing; x<width; x+=spacing) {
            for(let y=spacing; y<height; y+=spacing) {
              const dist = Math.hypot(x-cx, y-cy);
              const wave = Math.sin(dist*0.01 - time*2) * 20 * params.intensity;
              const r = 1 + (bass * 5);
              ctx.beginPath();
              ctx.arc(x, y + wave, r, 0, Math.PI*2);
              ctx.fill();
            }
          }
          break;

        case "NoiseGlitch":
          if(bass > 0.6) {
            for(let i=0; i<10; i++) {
              const x = Math.random() * width;
              const y = Math.random() * height;
              const w = Math.random() * width * 0.5;
              const h = Math.random() * 20;
              ctx.fillStyle = calculateModColor(params.color, groupColorRgb, Math.random());
              ctx.fillRect(x - w/2, y, w, h);
            }
            // 画面ズレ
            const shift = (Math.random()-0.5) * 50 * bass;
            ctx.drawImage(canvas, shift, 0);
          }
          break;
      }
      ctx.restore();

      
      // --- Audio Reactive Hue ---
      if (params.hueSource !== 'None') {
        let _band = 0;
        if (params.hueSource === 'Low') _band = (currentFFT[1]+currentFFT[2]+currentFFT[3])/3/255;
        else if (params.hueSource === 'Mid') { let s=0; for(let i=20;i<=30;i++) s+=currentFFT[i]; _band=s/11/255; }
        else if (params.hueSource === 'High') { let s=0; for(let i=100;i<=120;i++) s+=currentFFT[i]; _band=s/21/255; }
        canvas.style.filter = 'hue-rotate(' + (_band * params.hueAmount) + 'deg)';
      } else { canvas.style.filter = ''; }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
