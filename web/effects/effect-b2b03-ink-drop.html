<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "b2bMode", "label": "B2B Mode", "type": "select", "options": ["Left", "Right", "Center"], "default": "Left" },
      { "id": "dropCount", "label": "ドロップ数", "type": "range", "min": 1, "max": 20, "step": 1, "default": 5 },
      { "id": "color", "label": "色", "type": "color", "default": "#000000" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.9 },
      { "id": "gravity", "label": "重力", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.0 },
      { "id": "reactLow", "label": "低音反応", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 3.0 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let params = { b2bMode: "Left", dropCount: 5, color: "#000000", opacity: 0.9, gravity: 1.0, reactLow: 3.0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    
    let drops = [];

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color', 'b2bMode'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function spawnDrop() {
      const isLeft = params.b2bMode === "Left" || (params.b2bMode === "Center" && Math.random() > 0.5);
      const bx = isLeft ? Math.random() * (width/2) : width/2 + Math.random() * (width/2);
      drops.push({
        x: bx,
        y: -50,
        r: 10 + Math.random() * 40,
        vy: 0,
        sway: Math.random() * Math.PI * 2
      });
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      time += 0.05;
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      
      if (bass > 0.4 * (1/(params.reactLow||0.001)) && Math.random() < 0.2) {
        spawnDrop();
      }

      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, width, height);
      
      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${params.opacity})`;

      // Draw drops with blur for liquid effect
      ctx.filter = "blur(10px)";
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.vy += params.gravity * 0.1 * (1 + bass * params.reactLow);
        d.y += d.vy;
        d.sway += 0.05;
        d.x += Math.sin(d.sway) * 2;

        ctx.beginPath();
        // Draw trailing drop shape
        ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(d.x - d.r, d.y);
        ctx.lineTo(d.x + d.r, d.y);
        ctx.lineTo(d.x + Math.sin(d.sway)*d.r, d.y - d.r * 3);
        ctx.fill();

        if (d.y > height + 200) drops.splice(i, 1);
      }
      ctx.filter = "none";

      // Constant background noise if drops exist
      if (drops.length < params.dropCount && Math.random() < 0.05) spawnDrop();

      // B2B Mask
      if (params.b2bMode !== "Center") {
        ctx.globalCompositeOperation = "destination-in";
        const cx = width / 2;
        const sign = params.b2bMode === "Left" ? -1 : 1;
        const fadeWidth = 400;
        
        ctx.beginPath();
        if (params.b2bMode === "Left") ctx.rect(0, 0, cx - fadeWidth/2, height);
        else ctx.rect(cx + fadeWidth/2, 0, width, height);
        ctx.fillStyle = "rgba(255,255,255,1)";
        ctx.fill();

        for(let y=0; y<height; y+=20) {
          // Slow organic liquid boundary
          const wave = Math.sin(y*0.005 + time*0.5) * 100 + Math.cos(y*0.01 - time*0.2) * 80;
          const maskGrad = ctx.createLinearGradient(cx + wave, 0, cx + wave + (fadeWidth * sign), 0);
          maskGrad.addColorStop(0, "rgba(255,255,255,1)");
          maskGrad.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = maskGrad;
          ctx.fillRect(cx - fadeWidth - 100, y, fadeWidth*2 + 200, 25);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
