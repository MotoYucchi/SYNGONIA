<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "frameWidth", "label": "枠の太さ", "type": "range", "min": 5, "max": 80, "step": 1, "default": 20 },
    { "id": "bounceReact", "label": "バウンス反応", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5 },
    { "id": "layerCount", "label": "枠レイヤー数", "type": "range", "min": 1, "max": 5, "step": 1, "default": 2 },
    { "id": "glow", "label": "グロー強度", "type": "range", "min": 0, "max": 50, "step": 1, "default": 20 },
    { "id": "waveAmount", "label": "波打ち量", "type": "range", "min": 0, "max": 30, "step": 1, "default": 10 },
    { "id": "sizeReact", "label": "サイズ反応", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5 },
    { "id": "colorReactLow", "label": "Low→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 120 },
    { "id": "colorReactMid", "label": "Mid→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 60 },
    { "id": "colorReactHigh", "label": "High→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 30 },
    { "id": "smoothing", "label": "スムージング", "type": "range", "min": 0.05, "max": 0.5, "step": 0.01, "default": 0.15 },
    { "id": "color", "label": "ベース色", "type": "color", "default": "#00ffcc" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let params = {
  frameWidth: 20, bounceReact: 1.5, layerCount: 2, glow: 20,
  waveAmount: 10, sizeReact: 1.5,
  colorReactLow: 120, colorReactMid: 60, colorReactHigh: 30,
  smoothing: 0.15, color: '#00ffcc', opacity: 1.0,
  shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let time = 0;
let smoothLow = 0, smoothMid = 0, smoothHigh = 0;
let prevLow = 0, prevMid = 0, prevHigh = 0;

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 255, b: 204 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color'].includes(msg.paramId) ? msg.value : Number(msg.value);
  } else if (msg.type === 'audio_data' && msg.fft) {
    currentFFT = msg.fft;
  } else if (msg.type === 'group_update') {
    groupColorRgb = hexToRgb(msg.color);
  }
});

function getLow() { let s = 0; for (let i = 0; i <= 10; i++) s += currentFFT[i]; return (s / 11) / 255; }
function getMid() { let s = 0; for (let i = 20; i <= 60; i++) s += currentFFT[i]; return (s / 41) / 255; }
function getHigh() { let s = 0; for (let i = 100; i <= 200; i++) s += currentFFT[i]; return (s / 101) / 255; }

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawLow = getLow();
  const rawMid = getMid();
  const rawHigh = getHigh();

  const sm = params.smoothing;
  smoothLow += (rawLow - smoothLow) * sm;
  smoothMid += (rawMid - smoothMid) * sm;
  smoothHigh += (rawHigh - smoothHigh) * sm;

  const deltaLow = Math.abs(rawLow - prevLow);
  const deltaMid = Math.abs(rawMid - prevMid);
  const deltaHigh = Math.abs(rawHigh - prevHigh);
  prevLow = rawLow; prevMid = rawMid; prevHigh = rawHigh;

  time += 0.016;
  ctx.clearRect(0, 0, width, height);

  const lRgb = hexToRgb(params.color);
  const baseR = Math.min(255, lRgb.r + groupColorRgb.r);
  const baseG = Math.min(255, lRgb.g + groupColorRgb.g);
  const baseB = Math.min(255, lRgb.b + groupColorRgb.b);
  const baseHue = (Math.atan2(baseB - 128, baseR - 128) * 180 / Math.PI + 360) % 360;

  const shiftXPx = (params.shiftX / 100) * (width / 2);
  const shiftYPx = (params.shiftY / 100) * (height / 2);

  ctx.save();
  ctx.translate(shiftXPx, shiftYPx);

  const frameW = params.frameWidth * (1 + smoothLow * params.bounceReact);
  const glowAmt = params.glow * (1 + smoothLow);
  const layers = Math.floor(params.layerCount + smoothMid * 2);
  const waveStr = params.waveAmount * smoothHigh;
  const segments = 60; // 辺の分割数（波打ち用）

  for (let li = 0; li < layers; li++) {
    const offset = li * (frameW + 4);
    const hue = baseHue
      + smoothLow * params.colorReactLow
      + deltaMid * params.colorReactMid * 3
      + deltaHigh * params.colorReactHigh * 5
      + li * 35;
    const sat = 0.85 + smoothMid * 0.15;
    const lit = 0.4 + smoothHigh * 0.3 + deltaLow * 0.3;
    const rgb = hslToRgb(hue, sat, lit);
    const alpha = params.opacity * (0.5 + smoothLow * 0.5) * (1 - li * 0.12);

    // フラッシュブースト
    const flashBoost = deltaLow > 0.12 ? Math.min(0.4, deltaLow * 2) : 0;
    const finalAlpha = Math.min(1, alpha + flashBoost);

    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${finalAlpha})`;
    ctx.lineWidth = frameW * (1 - li * 0.15);
    ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},${finalAlpha})`;
    ctx.shadowBlur = glowAmt * (1 - li * 0.1);

    if (waveStr > 0.5) {
      // 波打ちフレーム（パスで描画）
      ctx.beginPath();
      // 上辺
      for (let s = 0; s <= segments; s++) {
        const t = s / segments;
        const x = offset + t * (width - offset * 2);
        const y = offset + Math.sin(time * 3 + t * 12 + li) * waveStr;
        s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      // 右辺
      for (let s = 0; s <= segments; s++) {
        const t = s / segments;
        const x = width - offset + Math.sin(time * 3 + t * 12 + li + 2) * waveStr;
        const y = offset + t * (height - offset * 2);
        ctx.lineTo(x, y);
      }
      // 下辺
      for (let s = segments; s >= 0; s--) {
        const t = s / segments;
        const x = offset + t * (width - offset * 2);
        const y = height - offset + Math.sin(time * 3 + t * 12 + li + 4) * waveStr;
        ctx.lineTo(x, y);
      }
      // 左辺
      for (let s = segments; s >= 0; s--) {
        const t = s / segments;
        const x = offset + Math.sin(time * 3 + t * 12 + li + 6) * waveStr;
        const y = offset + t * (height - offset * 2);
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    } else {
      // ストレートフレーム
      ctx.strokeRect(
        offset + frameW / 2,
        offset + frameW / 2,
        width - (offset + frameW / 2) * 2,
        height - (offset + frameW / 2) * 2
      );
    }
  }

  // 内側ビネット（枠→中央に向かって減衰）
  const vigW = frameW * layers + 20;
  const vigAlpha = params.opacity * 0.15 * smoothLow;
  const vigHue = baseHue + smoothLow * params.colorReactLow;
  const vigRgb = hslToRgb(vigHue, 0.6, 0.4);

  // 上
  const gT = ctx.createLinearGradient(0, 0, 0, vigW);
  gT.addColorStop(0, `rgba(${vigRgb.r},${vigRgb.g},${vigRgb.b},${vigAlpha})`);
  gT.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.shadowBlur = 0;
  ctx.fillStyle = gT;
  ctx.fillRect(0, 0, width, vigW);
  // 下
  const gB = ctx.createLinearGradient(0, height, 0, height - vigW);
  gB.addColorStop(0, `rgba(${vigRgb.r},${vigRgb.g},${vigRgb.b},${vigAlpha})`);
  gB.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gB;
  ctx.fillRect(0, height - vigW, width, vigW);
  // 左
  const gL = ctx.createLinearGradient(0, 0, vigW, 0);
  gL.addColorStop(0, `rgba(${vigRgb.r},${vigRgb.g},${vigRgb.b},${vigAlpha})`);
  gL.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gL;
  ctx.fillRect(0, 0, vigW, height);
  // 右
  const gR = ctx.createLinearGradient(width, 0, width - vigW, 0);
  gR.addColorStop(0, `rgba(${vigRgb.r},${vigRgb.g},${vigRgb.b},${vigAlpha})`);
  gR.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gR;
  ctx.fillRect(width - vigW, 0, vigW, height);

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
