<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script id="vj-schema" type="application/json">
    [
      { "id": "opacity", "label": "Master Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.6 },
      { "id": "color", "label": "Base Color", "type": "color", "default": "#3388aa" },
      { "id": "speed", "label": "Drift Speed", "type": "range", "min": 0, "max": 3, "step": 0.05, "default": 0.4 },
      { "id": "count", "label": "Orb Count", "type": "range", "min": 3, "max": 30, "step": 1, "default": 12 },
      { "id": "sizeBase", "label": "Orb Size", "type": "range", "min": 20, "max": 300, "step": 1, "default": 100 },
      { "id": "reactLow", "label": "Low React (Size)", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 2.0 },
      { "id": "reactMid", "label": "Mid React (Drift)", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.0 },
      { "id": "reactHigh", "label": "High React (Glow)", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.5 }
    ,
      { "id": "hueSource", "label": "Hue Band", "type": "select", "options": ["None", "Low", "Mid", "High"], "default": "None" },
      { "id": "hueAmount", "label": "Hue Amount", "type": "range", "min": -360, "max": 360, "step": 1, "default": 90 }
    ]
  </script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let params = { opacity: 0.6, color: '#3388aa', speed: 0.4, count: 12, sizeBase: 100, reactLow: 2.0, reactMid: 1.0, reactHigh: 1.5 , hueSource: "None", hueAmount: 90 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;

    // Orb state
    let orbs = [];
    function initOrbs(n) {
      orbs = Array.from({length: n}, (_, i) => ({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.002,
        vy: (Math.random() - 0.5) * 0.002,
        phase: Math.random() * Math.PI * 2,
        sizeMul: 0.5 + Math.random() * 1.0
      }));
    }
    initOrbs(params.count);

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 51, g: 136, b: 170 };
    }

    // Universal baseA handler - apply layer alpha as body opacity
    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        params[msg.paramId] = ['color', 'hueSource'].includes(msg.paramId) ? msg.value : Number(msg.value);
        if (msg.paramId === 'count') initOrbs(Number(msg.value));
      } else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];

      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = `hue-rotate(${_hueDeg}deg)`;
      else canvas.style.filter = '';
      const high = (highSum / 21) / 255.0 || 0;

      time += params.speed * 0.01;
      ctx.clearRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'lighter';

      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      orbs.forEach(orb => {
        // Drift movement
        const driftMul = 1 + mid * params.reactMid;
        orb.x += orb.vx * driftMul;
        orb.y += orb.vy * driftMul;
        // Wrap
        if (orb.x < -0.2) orb.x = 1.2;
        if (orb.x > 1.2) orb.x = -0.2;
        if (orb.y < -0.2) orb.y = 1.2;
        if (orb.y > 1.2) orb.y = -0.2;

        const px = orb.x * width;
        const py = orb.y * height;
        const size = params.sizeBase * orb.sizeMul * (1 + bass * params.reactLow * 0.5);
        const glowAlpha = params.opacity * (0.15 + high * params.reactHigh * 0.2);
        const breathe = 0.8 + Math.sin(time * 2 + orb.phase) * 0.2;

        const grad = ctx.createRadialGradient(px, py, 0, px, py, size * breathe);
        grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${glowAlpha})`);
        grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${glowAlpha * 0.4})`);
        grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py, size * breathe, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
