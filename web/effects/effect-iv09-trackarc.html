<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "ringCount", "label": "リング数", "type": "range", "min": 1, "max": 5, "step": 1, "default": 3 },
    { "id": "arcLength", "label": "アーク長", "type": "range", "min": 0.1, "max": 3.0, "step": 0.1, "default": 1.0 },
    { "id": "dotCount", "label": "ドット数", "type": "range", "min": 4, "max": 60, "step": 1, "default": 20 },
    { "id": "ellipseRatio", "label": "楕円率", "type": "range", "min": 0.3, "max": 1.0, "step": 0.05, "default": 0.6 },
    { "id": "rotSpeed", "label": "回転速度", "type": "range", "min": 0, "max": 3, "step": 0.05, "default": 0.8 },
    { "id": "ringRadius", "label": "リング半径", "type": "range", "min": 100, "max": 600, "step": 10, "default": 300 },
    { "id": "sizeReact", "label": "サイズ反応", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5 },
    { "id": "colorReactLow", "label": "Low→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 120 },
    { "id": "colorReactMid", "label": "Mid→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 60 },
    { "id": "colorReactHigh", "label": "High→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 30 },
    { "id": "smoothing", "label": "スムージング", "type": "range", "min": 0.05, "max": 0.5, "step": 0.01, "default": 0.15 },
    { "id": "color", "label": "ベース色", "type": "color", "default": "#00ffcc" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
}
window.addEventListener('resize', resize);
resize();

let params = {
  ringCount: 3, arcLength: 1.0, dotCount: 20, ellipseRatio: 0.6,
  rotSpeed: 0.8, ringRadius: 300, sizeReact: 1.5,
  colorReactLow: 120, colorReactMid: 60, colorReactHigh: 30,
  smoothing: 0.15, color: '#00ffcc', opacity: 1.0,
  shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let time = 0;
let smoothLow = 0, smoothMid = 0, smoothHigh = 0;
let prevLow = 0, prevMid = 0, prevHigh = 0;

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 255, b: 204 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color'].includes(msg.paramId) ? msg.value : Number(msg.value);
  } else if (msg.type === 'audio_data' && msg.fft) {
    currentFFT = msg.fft;
  } else if (msg.type === 'group_update') {
    groupColorRgb = hexToRgb(msg.color);
  }
});

function getLow() { let s = 0; for (let i = 0; i <= 10; i++) s += currentFFT[i]; return (s / 11) / 255; }
function getMid() { let s = 0; for (let i = 20; i <= 60; i++) s += currentFFT[i]; return (s / 41) / 255; }
function getHigh() { let s = 0; for (let i = 100; i <= 200; i++) s += currentFFT[i]; return (s / 101) / 255; }

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawLow = getLow();
  const rawMid = getMid();
  const rawHigh = getHigh();

  const sm = params.smoothing;
  smoothLow += (rawLow - smoothLow) * sm;
  smoothMid += (rawMid - smoothMid) * sm;
  smoothHigh += (rawHigh - smoothHigh) * sm;

  const deltaLow = Math.abs(rawLow - prevLow);
  const deltaMid = Math.abs(rawMid - prevMid);
  const deltaHigh = Math.abs(rawHigh - prevHigh);
  prevLow = rawLow; prevMid = rawMid; prevHigh = rawHigh;

  time += 0.016;
  ctx.clearRect(0, 0, width, height);

  const lRgb = hexToRgb(params.color);
  const baseR = Math.min(255, lRgb.r + groupColorRgb.r);
  const baseG = Math.min(255, lRgb.g + groupColorRgb.g);
  const baseB = Math.min(255, lRgb.b + groupColorRgb.b);
  const baseHue = (Math.atan2(baseB - 128, baseR - 128) * 180 / Math.PI + 360) % 360;

  const shiftX = (params.shiftX / 100) * cx;
  const shiftY = (params.shiftY / 100) * cy;

  ctx.save();
  ctx.translate(cx + shiftX, cy + shiftY);

  const ringCount = Math.floor(params.ringCount);
  const effDotCount = Math.floor(params.dotCount + smoothHigh * 20);

  for (let ri = 0; ri < ringCount; ri++) {
    const radius = params.ringRadius * (1 + ri * 0.3) * (1 + smoothLow * params.sizeReact * 0.3);
    const radiusY = radius * params.ellipseRatio;
    const dir = ri % 2 === 0 ? 1 : -1;
    const rot = time * params.rotSpeed * (1 + ri * 0.2) * dir;

    const hueBase = baseHue
      + smoothLow * params.colorReactLow
      + deltaMid * params.colorReactMid * 3
      + deltaHigh * params.colorReactHigh * 5
      + ri * 45;

    // ドット描画
    for (let di = 0; di < effDotCount; di++) {
      const angle = (di / effDotCount) * Math.PI * 2 + rot;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radiusY;

      const dotR = (2 + smoothLow * 4 * params.sizeReact) * (1 + deltaLow);
      const hue = hueBase + di * (360 / effDotCount) * 0.2;
      const sat = 0.8 + smoothMid * 0.2;
      const lit = 0.45 + smoothHigh * 0.3 + deltaLow * 0.2;
      const rgb = hslToRgb(hue, sat, lit);
      const alpha = params.opacity * (0.4 + smoothLow * 0.5) * (1 - ri * 0.1);

      ctx.beginPath();
      ctx.arc(x, y, dotR, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
      ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
      ctx.shadowBlur = 6 + smoothLow * 10;
      ctx.fill();
    }

    // アーク描画（弧線セグメント）
    const arcSegs = Math.max(2, Math.floor(4 + smoothMid * 4));
    const arcLen = params.arcLength;
    const arcThick = 2 + smoothLow * 4;

    for (let ai = 0; ai < arcSegs; ai++) {
      const arcStart = rot + (ai / arcSegs) * Math.PI * 2;
      const arcEnd = arcStart + arcLen;

      const arcHue = hueBase + ai * 30 + smoothMid * params.colorReactMid;
      const arcRgb = hslToRgb(arcHue, 0.9, 0.5 + deltaLow * 0.3);
      const arcAlpha = params.opacity * (0.3 + smoothLow * 0.5) * (1 - ri * 0.1);

      // 楕円アークをパスで描画
      ctx.beginPath();
      const steps = 30;
      for (let s = 0; s <= steps; s++) {
        const t = arcStart + (s / steps) * (arcEnd - arcStart);
        const px = Math.cos(t) * radius;
        const py = Math.sin(t) * radiusY;
        s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(${arcRgb.r},${arcRgb.g},${arcRgb.b},${arcAlpha})`;
      ctx.lineWidth = arcThick;
      ctx.shadowColor = `rgba(${arcRgb.r},${arcRgb.g},${arcRgb.b},${arcAlpha})`;
      ctx.shadowBlur = 8 + smoothLow * 12;
      ctx.stroke();
    }
  }

  ctx.shadowBlur = 0;
  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
