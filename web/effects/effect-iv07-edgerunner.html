<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "particleCount", "label": "パーティクル数", "type": "range", "min": 2, "max": 40, "step": 1, "default": 12 },
    { "id": "speed", "label": "速度", "type": "range", "min": 0.1, "max": 5, "step": 0.1, "default": 2.0 },
    { "id": "trailLength", "label": "残像長さ", "type": "range", "min": 5, "max": 80, "step": 1, "default": 30 },
    { "id": "edgeWidth", "label": "端の幅", "type": "range", "min": 5, "max": 100, "step": 1, "default": 30 },
    { "id": "dotSize", "label": "ドットサイズ", "type": "range", "min": 1, "max": 15, "step": 0.5, "default": 4 },
    { "id": "sizeReact", "label": "サイズ反応", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5 },
    { "id": "colorReactLow", "label": "Low→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 120 },
    { "id": "colorReactMid", "label": "Mid→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 60 },
    { "id": "colorReactHigh", "label": "High→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 30 },
    { "id": "smoothing", "label": "スムージング", "type": "range", "min": 0.05, "max": 0.5, "step": 0.01, "default": 0.15 },
    { "id": "color", "label": "ベース色", "type": "color", "default": "#00ffcc" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let params = {
  particleCount: 12, speed: 2.0, trailLength: 30, edgeWidth: 30,
  dotSize: 4, sizeReact: 1.5,
  colorReactLow: 120, colorReactMid: 60, colorReactHigh: 30,
  smoothing: 0.15, color: '#00ffcc', opacity: 1.0,
  shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let time = 0;
let smoothLow = 0, smoothMid = 0, smoothHigh = 0;
let prevLow = 0, prevMid = 0, prevHigh = 0;

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 255, b: 204 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color'].includes(msg.paramId) ? msg.value : Number(msg.value);
    if (msg.paramId === 'particleCount') initParticles();
  } else if (msg.type === 'audio_data' && msg.fft) {
    currentFFT = msg.fft;
  } else if (msg.type === 'group_update') {
    groupColorRgb = hexToRgb(msg.color);
  }
});

function getLow() { let s = 0; for (let i = 0; i <= 10; i++) s += currentFFT[i]; return (s / 11) / 255; }
function getMid() { let s = 0; for (let i = 20; i <= 60; i++) s += currentFFT[i]; return (s / 41) / 255; }
function getHigh() { let s = 0; for (let i = 100; i <= 200; i++) s += currentFFT[i]; return (s / 101) / 255; }

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
}

// パーティクル
let particles = [];

function initParticles() {
  const count = Math.floor(params.particleCount);
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      progress: i / count,               // 0-1 周回位置
      speedMul: 0.8 + Math.random() * 0.4, // 個体速度差
      trail: []                           // 残像座標
    });
  }
}
initParticles();

// 周回位置 (0-1) → 画面端の座標
function progressToXY(p) {
  const perim = 2 * (width + height);
  const d = p * perim;
  if (d < width) return { x: d, y: 0 };                           // 上辺
  if (d < width + height) return { x: width, y: d - width };      // 右辺
  if (d < 2 * width + height) return { x: width - (d - width - height), y: height }; // 下辺
  return { x: 0, y: height - (d - 2 * width - height) };          // 左辺
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawLow = getLow();
  const rawMid = getMid();
  const rawHigh = getHigh();

  const sm = params.smoothing;
  smoothLow += (rawLow - smoothLow) * sm;
  smoothMid += (rawMid - smoothMid) * sm;
  smoothHigh += (rawHigh - smoothHigh) * sm;

  const deltaLow = Math.abs(rawLow - prevLow);
  const deltaMid = Math.abs(rawMid - prevMid);
  const deltaHigh = Math.abs(rawHigh - prevHigh);
  prevLow = rawLow; prevMid = rawMid; prevHigh = rawHigh;

  time += 0.016;
  ctx.clearRect(0, 0, width, height);

  const lRgb = hexToRgb(params.color);
  const baseR = Math.min(255, lRgb.r + groupColorRgb.r);
  const baseG = Math.min(255, lRgb.g + groupColorRgb.g);
  const baseB = Math.min(255, lRgb.b + groupColorRgb.b);
  const baseHue = (Math.atan2(baseB - 128, baseR - 128) * 180 / Math.PI + 360) % 360;

  const shiftXPx = (params.shiftX / 100) * (width / 2);
  const shiftYPx = (params.shiftY / 100) * (height / 2);

  ctx.save();
  ctx.translate(shiftXPx, shiftYPx);

  const speedFactor = params.speed * (1 + smoothLow * params.sizeReact) * 0.0004;
  const trailMax = Math.floor(params.trailLength + smoothHigh * 20);
  const dSize = params.dotSize * (1 + deltaLow * params.sizeReact * 2);
  const ew = params.edgeWidth;

  for (let i = 0; i < particles.length; i++) {
    const pt = particles[i];
    pt.progress += speedFactor * pt.speedMul;
    if (pt.progress >= 1) pt.progress -= 1;

    const pos = progressToXY(pt.progress);
    pt.trail.unshift({ x: pos.x, y: pos.y });
    if (pt.trail.length > trailMax) pt.trail.length = trailMax;

    const hue = baseHue
      + smoothMid * params.colorReactMid
      + deltaMid * params.colorReactMid * 3
      + deltaHigh * params.colorReactHigh * 5
      + i * (360 / particles.length);
    const sat = 0.8 + smoothMid * 0.2;
    const lit = 0.45 + smoothHigh * 0.3 + deltaLow * 0.2;
    const rgb = hslToRgb(hue, sat, lit);
    const alpha = params.opacity * (0.5 + smoothLow * 0.5);

    // 残像の描画
    for (let t = 0; t < pt.trail.length; t++) {
      const trailAlpha = alpha * (1 - t / pt.trail.length) * 0.6;
      const trailSize = dSize * (1 - t / pt.trail.length * 0.5);
      if (trailAlpha < 0.01) break;
      ctx.beginPath();
      ctx.arc(pt.trail[t].x, pt.trail[t].y, trailSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${trailAlpha})`;
      ctx.fill();
    }

    // メインドット
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, dSize, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.shadowBlur = 10 + smoothLow * 15;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 端のグロー帯（edgeWidth幅の帯に薄いグラデーション）
  const glowHue = baseHue + smoothLow * params.colorReactLow;
  const glowRgb = hslToRgb(glowHue, 0.7, 0.5);
  const glowAlpha = params.opacity * smoothLow * 0.25;

  // 上端
  const gradT = ctx.createLinearGradient(0, 0, 0, ew);
  gradT.addColorStop(0, `rgba(${glowRgb.r},${glowRgb.g},${glowRgb.b},${glowAlpha})`);
  gradT.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradT;
  ctx.fillRect(0, 0, width, ew);

  // 下端
  const gradB = ctx.createLinearGradient(0, height, 0, height - ew);
  gradB.addColorStop(0, `rgba(${glowRgb.r},${glowRgb.g},${glowRgb.b},${glowAlpha})`);
  gradB.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradB;
  ctx.fillRect(0, height - ew, width, ew);

  // 左端
  const gradL = ctx.createLinearGradient(0, 0, ew, 0);
  gradL.addColorStop(0, `rgba(${glowRgb.r},${glowRgb.g},${glowRgb.b},${glowAlpha})`);
  gradL.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradL;
  ctx.fillRect(0, 0, ew, height);

  // 右端
  const gradR = ctx.createLinearGradient(width, 0, width - ew, 0);
  gradR.addColorStop(0, `rgba(${glowRgb.r},${glowRgb.g},${glowRgb.b},${glowAlpha})`);
  gradR.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradR;
  ctx.fillRect(width - ew, 0, ew, height);

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
