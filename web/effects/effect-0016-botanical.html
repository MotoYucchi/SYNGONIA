<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {
            "id": "layout",
            "label": "Layout",
            "type": "select",
            "options": [
                  "Center",
                  "Bottom"
            ],
            "default": "Bottom"
      },
      {
            "id": "opacity",
            "label": "Opacity",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 1.0
      },
      {
            "id": "color",
            "label": "Base Color",
            "type": "color",
            "default": "#00ff44"
      },
      {
            "id": "lineThickness",
            "label": "Line Thickness",
            "type": "range",
            "min": 0.1,
            "max": 10.0,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "reactLow",
            "label": "Bass React (Scale)",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.5
      },
      {
            "id": "reactMid",
            "label": "Mid React (Branch)",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "reactHigh",
            "label": "High React (Spark)",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      },
      {
            "id": "shiftX",
            "label": "Shift X",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      },
      {
            "id": "shiftY",
            "label": "Shift Y",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, cx, cy;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2;
      cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { layout: "Bottom", opacity: 1.0, color: "#00ff44", lineThickness: 1.0, reactLow: 1.5, reactMid: 1.0, reactHigh: 1.0, hueSource: "None", hueAmount: 90, shiftX: 0, shiftY: 0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    let particles = [];

    // Simple smooth noise function
    const PERLIN_YWRAPB = 4, PERLIN_YWRAP = 1 << PERLIN_YWRAPB, PERLIN_ZWRAPB = 8, PERLIN_ZWRAP = 1 << PERLIN_ZWRAPB, PERLIN_SIZE = 4095;
    let perlin = null;
    function noise(x, y, z) {
      y = y || 0; z = z || 0;
      if (perlin == null) {
        perlin = new Array(PERLIN_SIZE + 1);
        for (let i = 0; i < PERLIN_SIZE + 1; i++) { perlin[i] = Math.random(); }
      }
      if (x < 0) { x = -x; } if (y < 0) { y = -y; } if (z < 0) { z = -z; }
      let xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
      let xf = x - xi, yf = y - yi, zf = z - zi;
      let rxf = 0.5 * (1.0 - Math.cos(xf * Math.PI)), ryf = 0.5 * (1.0 - Math.cos(yf * Math.PI));
      let of = (xi & PERLIN_SIZE) + ((yi & PERLIN_SIZE) << PERLIN_YWRAPB) + ((zi & PERLIN_SIZE) << PERLIN_ZWRAPB);
      let n1 = perlin[of & PERLIN_SIZE];
      n1 += rxf * (perlin[(of + 1) & PERLIN_SIZE] - n1);
      let n2 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
      n2 += rxf * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n2);
      n1 += ryf * (n2 - n1);
      return n1;
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    }

    // Blend color with white based on RMS, and add opacity
    function calculateDynamicColor(layerHex, gRgb, rms) {
      const lRgb = hexToRgb(layerHex);
      let r = (lRgb.r + gRgb.r) % 256;
      let g = (lRgb.g + gRgb.g) % 256;
      let b = (lRgb.b + gRgb.b) % 256;
      
      // Shift towards white/cyan based on rms (rms typically 0 to 1)
      const shift = Math.min(rms * 1.5, 1.0);
      r = r + (255 - r) * shift;
      g = g + (255 - g) * shift * 0.8; 
      b = b + (255 - b) * shift;
      
      return `rgba(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)}, ${params.opacity})`;
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        params[msg.paramId] = (msg.paramId === 'color' || msg.paramId === 'layout' || msg.paramId === 'hueSource') ? msg.value : Number(msg.value);
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    function drawBranch(x, y, len, angle, depth, maxDepth, bass, mid, high, drawColor) {
      if (depth > maxDepth) {
        // High React -> Sparks
        if (high > 0.3 && Math.random() < high * params.reactHigh * 0.5) {
          particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10 * high * params.reactHigh,
            vy: (Math.random() - 0.5) * 10 * high * params.reactHigh,
            life: 1.0,
            color: drawColor
          });
        }
        return;
      }

      // Add noise to angle
      let n = noise(x * 0.005, y * 0.005, time * 0.5) - 0.5;
      let targetAngle = angle + n * 0.5;

      let targetX = x + Math.cos(targetAngle) * len;
      let targetY = y + Math.sin(targetAngle) * len;

      ctx.beginPath();
      ctx.moveTo(x, y);
      
      // Add slight bezier curve for organic feel
      let cpX = x + Math.cos(targetAngle) * len * 0.5 + (noise(x*0.01, time) - 0.5) * 20;
      let cpY = y + Math.sin(targetAngle) * len * 0.5 + (noise(y*0.01, time) - 0.5) * 20;
      
      ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
      ctx.stroke();

      // Branching angle affected by Mid
      let spread = 0.3 + mid * params.reactMid * 0.6;
      let nextLen = len * (0.7 + bass * 0.1);

      drawBranch(targetX, targetY, nextLen, angle - spread, depth + 1, maxDepth, bass, mid, high, drawColor);
      drawBranch(targetX, targetY, nextLen, angle + spread, depth + 1, maxDepth, bass, mid, high, drawColor);
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // Audio Analysis
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;
      
      let sumAll = 0; for(let i = 0; i < 150; i++) sumAll += currentFFT[i];
      const rms = (sumAll / 150) / 255.0 || 0;

      // Audio Reactive Hue (via filter)
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = bass;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = 'hue-rotate(' + _hueDeg + 'deg)';
      else canvas.style.filter = '';

      time += 0.02;
      const drawColor = calculateDynamicColor(params.color, groupColorRgb, rms);

      // Feedback Effect: fading out previous frames
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // 15% fade per frame
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = drawColor;
      // Line thickness reacts to RMS
      ctx.lineWidth = params.lineThickness + rms * 5;
      // Smooth out line ends
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Draw Main Motif
      let maxDepth = Math.floor(4 + mid * params.reactMid * 4); // Max depth 4 to 8
      if (maxDepth > 8) maxDepth = 8;
      
      let baseLength = (height * 0.15) * (1 + bass * params.reactLow);

      const shiftOffsetX = (params.shiftX || 0) / 100 * cx;
      const shiftOffsetY = (params.shiftY || 0) / 100 * cy;

      if (params.layout === "Bottom") {
        drawBranch(cx + shiftOffsetX, height + shiftOffsetY, baseLength, -Math.PI / 2, 0, maxDepth, bass, mid, high, drawColor);
      } else if (params.layout === "Center") {
        let numBranches = 6;
        for (let i = 0; i < numBranches; i++) {
          let angle = (Math.PI * 2 / numBranches) * i + time * 0.5;
          drawBranch(cx + shiftOffsetX, cy + shiftOffsetY, baseLength * 0.8, angle, 0, maxDepth - 1, bass, mid, high, drawColor);
        }
      }

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, (p.life * 3) + high * 5, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life * params.opacity;
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1.0;

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
