<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "shardCount", "label": "破片数", "type": "range", "min": 5, "max": 100, "step": 1, "default": 30 },
      { "id": "maxSize", "label": "最大サイズ", "type": "range", "min": 10, "max": 500, "step": 10, "default": 200 },
      { "id": "color", "label": "ベース色", "type": "color", "default": "#ffffff" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.8 },
      { "id": "reactHigh", "label": "高音反応", "type": "range", "min": 0, "max": 10, "step": 0.1, "default": 5.0 },
      { "id": "spinSpeed", "label": "回転速度", "type": "range", "min": 0, "max": 20, "step": 0.1, "default": 5.0 },
      { "id": "jitter", "label": "振動幅", "type": "range", "min": 0, "max": 100, "step": 1, "default": 20 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { shardCount: 30, maxSize: 200, color: "#ffffff", opacity: 0.8, reactHigh: 5.0, spinSpeed: 5.0, jitter: 20 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    
    let shards = [];

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
        
        if (msg.paramId === 'shardCount' || msg.paramId === 'maxSize') initShards();
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function initShards() {
      shards = [];
      for (let i = 0; i < params.shardCount; i++) {
        // Create random triangle
        const points = [];
        for (let j = 0; j < 3; j++) {
          points.push({
            x: (Math.random() - 0.5) * params.maxSize,
            y: (Math.random() - 0.5) * params.maxSize
          });
        }
        shards.push({
          cx: Math.random() * width,
          cy: Math.random() * height,
          points: points,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.1,
          life: 0
        });
      }
    }
    initShards();

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // High frequency bins
      let highSum = 0;
      for (let i = 150; i < 250; i++) highSum += currentFFT[i];
      const high = (highSum / 100) / 255.0 || 0;
      
      ctx.clearRect(0, 0, width, height);

      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      const trigger = high > 0.2 * (1 / (params.reactHigh || 0.001));

      shards.forEach(shard => {
        if (trigger && Math.random() < 0.3) {
          shard.life = 1.0;
          // Randomize position on hit
          shard.cx = Math.random() * width;
          shard.cy = Math.random() * height;
        }

        shard.life *= 0.85; // fast decay

        if (shard.life > 0.05) {
          shard.rot += shard.rotSpeed * params.spinSpeed * (1 + high * 10);
          
          const jx = (Math.random() - 0.5) * params.jitter * high * 10;
          const jy = (Math.random() - 0.5) * params.jitter * high * 10;

          ctx.save();
          ctx.translate(shard.cx + jx, shard.cy + jy);
          ctx.rotate(shard.rot);

          ctx.beginPath();
          ctx.moveTo(shard.points[0].x, shard.points[0].y);
          ctx.lineTo(shard.points[1].x, shard.points[1].y);
          ctx.lineTo(shard.points[2].x, shard.points[2].y);
          ctx.closePath();

          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${shard.life * params.opacity * 0.5})`;
          ctx.fill();
          
          ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${shard.life * params.opacity})`;
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.restore();
        }
      });

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
