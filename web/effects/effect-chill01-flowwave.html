<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script id="vj-schema" type="application/json">
    [
      { "id": "opacity", "label": "Master Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.7 },
      { "id": "color", "label": "Base Color", "type": "color", "default": "#6644aa" },
      { "id": "speed", "label": "Flow Speed", "type": "range", "min": 0, "max": 3, "step": 0.05, "default": 0.5 },
      { "id": "waveCount", "label": "Wave Layers", "type": "range", "min": 1, "max": 8, "step": 1, "default": 4 },
      { "id": "waveHeight", "label": "Wave Height", "type": "range", "min": 10, "max": 300, "step": 1, "default": 80 },
      { "id": "reactLow", "label": "Low React (Height)", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.5 },
      { "id": "reactMid", "label": "Mid React (Speed)", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.0 },
      { "id": "reactHigh", "label": "High React (Shimmer)", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.0 }
    ,
      { "id": "hueSource", "label": "Hue Band", "type": "select", "options": ["None", "Low", "Mid", "High"], "default": "None" },
      { "id": "hueAmount", "label": "Hue Amount", "type": "range", "min": -360, "max": 360, "step": 1, "default": 90 }
    ]
  </script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let params = { opacity: 0.7, color: '#6644aa', speed: 0.5, waveCount: 4, waveHeight: 80, reactLow: 1.5, reactMid: 1.0, reactHigh: 1.0 , hueSource: "None", hueAmount: 90 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 100, g: 68, b: 170 };
    }

    // Universal baseA handler - apply layer alpha as body opacity
    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        params[msg.paramId] = ['color', 'hueSource'].includes(msg.paramId) ? msg.value : Number(msg.value);
      } else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];

      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = `hue-rotate(${_hueDeg}deg)`;
      else canvas.style.filter = '';
      const high = (highSum / 21) / 255.0 || 0;

      time += params.speed * 0.008 * (1 + mid * params.reactMid);
      ctx.clearRect(0, 0, width, height);

      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      for (let w = 0; w < params.waveCount; w++) {
        const waveOffset = w / params.waveCount;
        const baseY = height * 0.3 + (height * 0.5 * waveOffset);
        const waveH = params.waveHeight * (1 + bass * params.reactLow) * (1 - waveOffset * 0.3);
        const shimmer = 0.15 + high * params.reactHigh * 0.3;
        const alpha = (params.opacity * (0.3 + waveOffset * 0.4)) * (0.8 + Math.sin(time * 3 + w) * shimmer);

        ctx.beginPath();
        ctx.moveTo(0, height);
        for (let x = 0; x <= width; x += 4) {
          const nx = x / width;
          const y = baseY + Math.sin(nx * 4 + time * (1.2 + w * 0.3)) * waveH
                          + Math.sin(nx * 7 + time * 0.7 + w) * waveH * 0.3;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
