<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {
            "id": "motif",
            "label": "モチーフ",
            "type": "select",
            "options": [
                  "Heart",
                  "Candy",
                  "Star",
                  "Mix"
            ],
            "default": "Mix"
      },
      {
            "id": "layout",
            "label": "レイアウト",
            "type": "select",
            "options": [
                  "Burst",
                  "Float"
            ],
            "default": "Burst"
      },
      {
            "id": "color1",
            "label": "キュート色1",
            "type": "color",
            "default": "#ff99cc"
      },
      {
            "id": "color2",
            "label": "キュート色2",
            "type": "color",
            "default": "#cc99ff"
      },
      {
            "id": "color3",
            "label": "キュート色3",
            "type": "color",
            "default": "#99ffff"
      },
      {
            "id": "opacity",
            "label": "透明度(全体)",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 0.9
      },
      {
            "id": "afterimage",
            "label": "残像の強さ",
            "type": "range",
            "min": 0,
            "max": 0.99,
            "step": 0.01,
            "default": 0.99
      },
      {
            "id": "speed",
            "label": "移動スピード",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "waveAmp",
            "label": "波打ちの振幅",
            "type": "range",
            "min": 0,
            "max": 200,
            "step": 1,
            "default": 50
      },
      {
            "id": "lowReactSize",
            "label": "低音 -> サイズ",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 2.0
      },
      {
            "id": "lowReactSpawn",
            "label": "低音 -> 生成数",
            "type": "range",
            "min": 0,
            "max": 10,
            "step": 0.1,
            "default": 3.0
      },
      {
            "id": "midReactHue",
            "label": "中音 -> 色相回転",
            "type": "range",
            "min": 0,
            "max": 360,
            "step": 1,
            "default": 180
      },
      {
            "id": "highReactFlash",
            "label": "高音 -> ぴかぴか",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 2.0
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      }
]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, cx, cy;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { motif: "Mix", layout: "Burst", color1: "#ff99cc", color2: "#cc99ff", color3: "#99ffff", opacity: 0.9, afterimage: 0.4, speed: 1.0, waveAmp: 50, lowReactSize: 2.0, lowReactSpawn: 3.0, midReactHue: 180, highReactFlash: 2.0, hueSource: "None", hueAmount: 90 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    let particles = [];

    // --- 色合成 (Modulo Math) ---
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    }

    function calculateModColorRgb(layerHex, gRgb) {
      const lRgb = hexToRgb(layerHex);
      const r = (lRgb.r + gRgb.r) % 256;
      const g = (lRgb.g + gRgb.g) % 256;
      const b = (lRgb.b + gRgb.b) % 256;
      return { r, g, b };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color1', 'color2', 'color3', 'motif', 'layout', 'hueSource'].includes(msg.paramId)) {
          params[msg.paramId] = msg.value;
        } else {
          params[msg.paramId] = Number(msg.value);
        }
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    // --- モチーフ描画関数 ---
    function drawHeart(ctx, size) {
      ctx.beginPath();
      ctx.moveTo(0, size * 0.3);
      ctx.bezierCurveTo(0, 0, -size * 0.6, 0, -size * 0.6, size * 0.4);
      ctx.bezierCurveTo(-size * 0.6, size * 0.8, 0, size * 1.1, 0, size * 1.4);
      ctx.bezierCurveTo(0, size * 1.1, size * 0.6, size * 0.8, size * 0.6, size * 0.4);
      ctx.bezierCurveTo(size * 0.6, 0, 0, 0, 0, size * 0.3);
      ctx.fill();
    }

    function drawCandy(ctx, size) {
      // 本体
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.8, 0, Math.PI * 2);
      ctx.fill();
      // 渦巻き模様（高音で太さが変わる）
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = size * 0.1 * (1 + currentFFT[110]/255 * params.highReactFlash);
      ctx.beginPath();
      for(let i=0; i<3; i++) {
          const a = time * 5 + i * Math.PI * 2 / 3;
          ctx.moveTo(0,0);
          ctx.conicGradient = ctx.createConicGradient(a, 0, 0);
          ctx.quadraticCurveTo(Math.cos(a)*size, Math.sin(a)*size, Math.cos(a+Math.PI/2)*size*1.2, Math.sin(a+Math.PI/2)*size*1.2);
      }
      ctx.stroke();
    }

    function drawStar(ctx, size) {
      // 丸みのあるポップな星
      ctx.beginPath();
      const spikes = 5;
      const outerRadius = size * 1.2;
      const innerRadius = size * 0.6;
      let angle = -Math.PI / 2;
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(Math.cos(angle) * outerRadius, Math.sin(angle) * outerRadius);
        angle += Math.PI / spikes;
        ctx.quadraticCurveTo(Math.cos(angle) * innerRadius * 0.8, Math.sin(angle) * innerRadius * 0.8, Math.cos(angle+Math.PI/spikes) * innerRadius, Math.sin(angle+Math.PI/spikes) * innerRadius);
        // ctx.lineTo(Math.cos(angle) * innerRadius, Math.sin(angle) * innerRadius);
        angle += Math.PI / spikes;
      }
      ctx.closePath();
      ctx.fill();
    }

    function createParticle() {
      const angle = Math.random() * Math.PI * 2;
      const speed = (Math.random() * 3 + 1) * params.speed;
      const colorId = Math.floor(Math.random() * 3);
      
      let type = params.motif;
      if (type === "Mix") {
          const types = ["Heart", "Candy", "Star"];
          type = types[Math.floor(Math.random() * 3)];
      }

      let startX = cx;
      let startY = cy;
      let vx = Math.cos(angle) * speed;
      let vy = Math.sin(angle) * speed;

      if (params.layout === "Float") {
        startX = Math.random() * width;
        startY = Math.random() * height;
        vx = (Math.random() - 0.5) * speed * 0.5;
        vy = (Math.random() - 0.5) * speed * 0.5;
      }

      return {
        x: startX,
        y: startY,
        vx: vx,
        vy: vy,
        size: Math.random() * 25 + 10,
        colorId: colorId,
        type: type,
        life: 1.0,
        death: Math.random() * 0.008 + 0.003,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.1,
        waveOffset: Math.random() * Math.PI * 2
      };
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // 1. FFT解析 (effect-0000-circle.html 準拠)
      const low = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;
      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = 'hue-rotate(' + _hueDeg + 'deg)';
      else canvas.style.filter = '';

      time += params.speed * 0.02;
      ctx.clearRect(0, 0, width, height);

      // 残像処理
      ctx.fillStyle = `rgba(0, 0, 0, ${1 - params.afterimage})`;
      ctx.fillRect(0, 0, width, height);

      // パーティクルの追加（低音で生成数アップ）
      const spawnCount = 1 + low * params.lowReactSpawn;
      if (particles.length < 300) {
          for(let i=0; i<spawnCount; i++) {
              if (Math.random() < 0.3) particles.push(createParticle());
          }
      }
      particles = particles.filter(p => p.life > 0);

      // 画面全体にMidで色相変化を適用（「ぴかぴか色がわって」）
      ctx.save();
      ctx.filter = `hue-rotate(${mid * params.midReactHue}deg)`;
      
      // グミのような質感のためのグラデーション
      ctx.globalCompositeOperation = 'lighter';

      particles.forEach(p => {
        p.life -= p.death;
        
        // 移動（低音でバーストの勢いアップ）
        p.x += p.vx * (1 + low * 3);
        p.y += p.vy * (1 + low * 3);
        
        // 波打ち運動（Wave）
        const waveX = Math.sin(time * 2 + p.waveOffset) * params.waveAmp * mid;
        const waveY = Math.cos(time * 2 + p.waveOffset) * params.waveAmp * mid;
        
        // 回転
        p.rot += p.rotV * (1 + mid * 2);

        // ポップなサイズ変化（低音）
        const currentSize = p.size * (1 + low * params.lowReactSize);
        
        // ぴかぴか透明度変化（高音）
        const pOpacity = p.life * params.opacity * (0.7 + Math.sin(time * 15 + p.waveOffset) * 0.3 * high * params.highReactFlash);

        // 描画位置
        const drawX = p.x + waveX;
        const drawY = p.y + waveY;

        // 画面外に出たらライフを減らす
        if (drawX < -currentSize * 2 || drawX > width + currentSize * 2 || drawY < -currentSize * 2 || drawY > height + currentSize * 2) {
            p.life -= 0.05;
        }

        // 色の合成
        const currentHex = params[`color${p.colorId + 1}`];
        const modRgb = calculateModColorRgb(currentHex, groupColorRgb);
        
        // グミのような質感のグラデーション
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, currentSize * 1.5);
        grad.addColorStop(0, `rgba(${modRgb.r}, ${modRgb.g}, ${modRgb.b}, ${pOpacity})`);
        grad.addColorStop(0.6, `rgba(${modRgb.r}, ${modRgb.g}, ${modRgb.b}, ${pOpacity * 0.8})`);
        grad.addColorStop(1, `rgba(${modRgb.r}, ${modRgb.g}, ${modRgb.b}, 0)`);
        
        ctx.fillStyle = grad;

        ctx.save();
        ctx.translate(drawX, drawY);
        ctx.rotate(p.rot);
        
        // モチーフ別の描画
        if (p.type === "Heart") drawHeart(ctx, currentSize);
        else if (p.type === "Candy") drawCandy(ctx, currentSize);
        else if (p.type === "Star") drawStar(ctx, currentSize);
        
        ctx.restore();
      });

      ctx.restore();

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
