<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {
            "id": "mode",
            "label": "Group Utility Mode",
            "type": "select",
            "options": [
                  "AmbientGlow",
                  "MasterFlash",
                  "ReactiveVignette",
                  "GroupParticles"
            ],
            "default": "AmbientGlow"
      },
      {
            "id": "opacity",
            "label": "Master Alpha",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 0.8
      },
      {
            "id": "color",
            "label": "Layer Color",
            "type": "color",
            "default": "#ffffff"
      },
      {
            "id": "reactLow",
            "label": "Low React (Intensity)",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.5
      },
      {
            "id": "reactMid",
            "label": "Mid React (Scale/Speed)",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "reactHigh",
            "label": "High React (Sharpness)",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      }
]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, cx, cy;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { mode: "AmbientGlow", opacity: 0.8, color: "#ffffff", reactLow: 1.5, reactMid: 1.0, reactHigh: 1.0, hueSource: "None", hueAmount: 90 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let particles = Array.from({length: 40}, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 5 + 2, v: Math.random() * 0.5 + 0.1 }));

    // 色変換 (effect-0000-circle.html 準拠)
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    function calculateModColor(layerHex, gRgb, alpha = 1.0) {
      const lRgb = hexToRgb(layerHex);
      const r = (lRgb.r + gRgb.r) % 256;
      const g = (lRgb.g + gRgb.g) % 256;
      const b = (lRgb.b + gRgb.b) % 256;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        params[msg.paramId] = (msg.paramId === 'color' || msg.paramId === 'mode') ? msg.value : Number(msg.value);
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // FFT解析 (effect-0000-circle.html の定義に準拠)
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;
      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = 'hue-rotate(' + _hueDeg + 'deg)';
      else canvas.style.filter = '';

      ctx.clearRect(0, 0, width, height);

      switch(params.mode) {
        case "AmbientGlow":
          // 低音に合わせて画面全体が呼吸するように光る
          const glowAlpha = bass * params.reactLow * params.opacity;
          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cx * (1 + mid * params.reactMid));
          grad.addColorStop(0, calculateModColor(params.color, groupColorRgb, glowAlpha));
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);
          break;

        case "MasterFlash":
          // 高音・低音のピークで瞬間的にαが跳ね上がる
          if (bass > 0.8 || high > 0.7) {
            ctx.fillStyle = calculateModColor(params.color, groupColorRgb, params.opacity);
            ctx.fillRect(0, 0, width, height);
          }
          break;

        case "ReactiveVignette":
          // 画面端を暗く、または色づける。中域で範囲が変化。
          ctx.save();
          const vAlpha = params.opacity * (0.5 + bass * params.reactLow);
          const vGrad = ctx.createRadialGradient(cx, cy, width * 0.2 * mid, cx, cy, width * 0.8);
          vGrad.addColorStop(0, "transparent");
          vGrad.addColorStop(1, calculateModColor(params.color, groupColorRgb, vAlpha));
          ctx.fillStyle = vGrad;
          ctx.fillRect(0, 0, width, height);
          ctx.restore();
          break;

        case "GroupParticles":
          // グループカラーの粒子が浮遊。高音で粒子のエッジが鋭くなる。
          ctx.globalAlpha = params.opacity;
          particles.forEach(p => {
            p.y -= p.v * (1 + mid * params.reactMid);
            if(p.y < -0.1) p.y = 1.1;
            ctx.beginPath();
            ctx.fillStyle = calculateModColor(params.color, groupColorRgb, 0.5 + bass * 0.5);
            const size = p.r * (1 + high * params.reactHigh);
            ctx.arc(p.x * width, p.y * height, size, 0, Math.PI * 2);
            ctx.fill();
          });
          break;
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
