<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {
            "id": "complexity",
            "label": "万華鏡の数",
            "type": "range",
            "min": 2,
            "max": 12,
            "step": 1,
            "default": 6
      },
      {
            "id": "speed",
            "label": "回転スピード",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "particleCount",
            "label": "キラキラ量",
            "type": "range",
            "min": 10,
            "max": 200,
            "step": 1,
            "default": 80
      },
      {
            "id": "opacity",
            "label": "透明度(全体)",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 0.8
      },
      {
            "id": "afterimage",
            "label": "残像の強さ",
            "type": "range",
            "min": 0,
            "max": 0.99,
            "step": 0.01,
            "default": 0.2
      },
      {
            "id": "color",
            "label": "ベース色",
            "type": "color",
            "default": "#00ffff"
      },
      {
            "id": "beatColorJump",
            "label": "ビートで色チェンジ",
            "type": "range",
            "min": 0,
            "max": 360,
            "step": 1,
            "default": 45
      },
      {
            "id": "beatAnim",
            "label": "Beat Animation",
            "type": "select",
            "options": [
                  "None",
                  "Pop",
                  "Zoom",
                  "Chaos"
            ],
            "default": "Pop"
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      },
      {
            "id": "shiftX",
            "label": "Shift X",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      },
      {
            "id": "shiftY",
            "label": "Shift Y",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      }
]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, cx, cy;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { complexity: 6, speed: 1.0, particleCount: 80, opacity: 0.8, afterimage: 0.2, color: "#00ffff", beatColorJump: 45, beatAnim: "Pop", hueSource: "None", hueAmount: 90, shiftX: 0, shiftY: 0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    let beatValue = 0;
    let beatHueOffset = 0; // ビートで変化する色相オフセット
    let particles = [];

    // --- 色計算ロジック ---
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    // モジュロ演算とビート色相をミックスしてrgbaを生成
    function getDynamicColor(alpha = 1.0, extraHue = 0) {
      const lRgb = hexToRgb(params.color);
      // 基本のModulo色
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);
      
      // HSLに変換して色相を回す（楽しさの演出）
      // beatHueOffsetがビートごとに加算され、色がジャンプする
      return `hsla(${(beatHueOffset + extraHue) % 360}, 100%, 60%, ${alpha * params.opacity})`;
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        params[msg.paramId] = (['color', 'beatAnim', 'hueSource'].includes(msg.paramId)) ? msg.value : Number(msg.value);
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      } else if (msg.type === 'beat') {
        beatValue = 1.0;
        // ビートの瞬間に色相を大きくジャンプさせる
        beatHueOffset += params.beatColorJump;
      }
    });

    function createParticle() {
      return {
        angle: Math.random() * Math.PI * 2,
        dist: Math.random() * 50,
        size: Math.random() * 4 + 2,
        v: Math.random() * 1.5 + 0.5,
        hue: Math.random() * 360
      };
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      const low = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;
      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = 'hue-rotate(' + _hueDeg + 'deg)';
      else canvas.style.filter = '';

      time += params.speed * 0.02;
      beatValue *= 0.9;

      // 残像効果（afterimageが小さいほど消えやすく、大きいほど長く残る）
      ctx.fillStyle = `rgba(0, 0, 0, ${1.0 - params.afterimage})`;
      ctx.fillRect(0, 0, width, height);

      if (particles.length < params.particleCount) particles.push(createParticle());
      if (particles.length > params.particleCount) particles.pop();

      ctx.save();
      const shiftOffsetX = (params.shiftX || 0) / 100 * cx;
      const shiftOffsetY = (params.shiftY || 0) / 100 * cy;
      ctx.translate(cx + shiftOffsetX, cy + shiftOffsetY);
      
      // ビートアニメーション（Pop, Zoom）
      let zoom = 1 + low * 0.3;
      if (params.beatAnim === "Pop") zoom += beatValue * 0.4;
      if (params.beatAnim === "Zoom") zoom *= (1 + Math.sin(time * 3) * 0.3);
      if (params.beatAnim === "Chaos") ctx.rotate(beatValue * 0.5);
      
      ctx.scale(zoom, zoom);
      ctx.rotate(time * 0.1 + (mid * 1.5));

      const slices = params.complexity;

      for (let i = 0; i < slices; i++) {
        ctx.save();
        ctx.rotate((i * Math.PI * 2) / slices);
        if (i % 2 === 0) ctx.scale(1, -1);

        // パーティクルの描画
        particles.forEach((p, idx) => {
          p.dist += p.v * (1 + high * 10);
          if (p.dist > width * 0.8) p.dist = 0;
          
          // パーティクル自体の色もビートで変わる
          ctx.fillStyle = getDynamicColor(1.0, p.hue + idx * 10);
          ctx.beginPath();
          const s = p.size * (1 + high * 4);
          
          // 高音に合わせて描画スタイル変化
          if (high > 0.6) {
            ctx.fillRect(p.dist, Math.cos(p.dist * 0.01 + time) * 100, s*2, 2);
          } else {
            ctx.arc(p.dist, Math.sin(p.dist * 0.01 + time) * 100, s, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // センターのライン模様
        ctx.strokeStyle = getDynamicColor(0.8, 180); // 対照的な色
        ctx.lineWidth = 1 + mid * 15;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(100, 50 + low*100, 50 + high*200, 150, 200 + low*50, 0);
        ctx.stroke();

        ctx.restore();
      }
      ctx.restore();

      // 低音の衝撃で画面をフラッシュ（透明度を考慮）
      if (low > 0.8) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = getDynamicColor(low * 0.3);
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
