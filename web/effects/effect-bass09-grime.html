<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "sliceCount", "label": "スライス数", "type": "range", "min": 1, "max": 100, "step": 1, "default": 20 },
      { "id": "intensity", "label": "ズレ幅", "type": "range", "min": 0, "max": 500, "step": 10, "default": 100 },
      { "id": "rgbShift", "label": "色収差", "type": "range", "min": 0, "max": 200, "step": 5, "default": 30 },
      { "id": "color", "label": "ベース色", "type": "color", "default": "#ffffff" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.8 },
      { "id": "reactLow", "label": "低音反応", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 2.0 },
      { "id": "sustain", "label": "余韻", "type": "range", "min": 0.5, "max": 0.99, "step": 0.01, "default": 0.8 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { sliceCount: 20, intensity: 100, rgbShift: 30, color: "#ffffff", opacity: 0.8, reactLow: 2.0, sustain: 0.8 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    
    let activeGlitch = 0; // 0 to 1

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      
      // Trigger glitch
      if (bass > 0.5 * (1 / (params.reactLow || 0.001))) {
        activeGlitch = Math.min(1.0, activeGlitch + bass * 0.5);
      }
      activeGlitch *= params.sustain;

      ctx.clearRect(0, 0, width, height);

      if (activeGlitch > 0.05) {
        const lRgb = hexToRgb(params.color);
        const r = Math.min(255, lRgb.r + groupColorRgb.r);
        const g = Math.min(255, lRgb.g + groupColorRgb.g);
        const b = Math.min(255, lRgb.b + groupColorRgb.b);

        ctx.globalCompositeOperation = "screen";

        const sliceH = height / params.sliceCount;
        for (let i = 0; i < params.sliceCount; i++) {
          if (Math.random() > activeGlitch) continue; // Not every slice tears

          const y = i * sliceH;
          const h = sliceH * (1 + Math.random());
          const shift = (Math.random() - 0.5) * params.intensity * activeGlitch;
          const shiftR = shift + params.rgbShift * activeGlitch * (Math.random() > 0.5 ? 1 : -1);
          const shiftB = shift - params.rgbShift * activeGlitch * (Math.random() > 0.5 ? 1 : -1);

          // Draw Red channel
          ctx.fillStyle = `rgba(${r}, 0, 0, ${params.opacity * activeGlitch})`;
          ctx.fillRect(shiftR, y, width, h);

          // Draw Green channel
          ctx.fillStyle = `rgba(0, ${g}, 0, ${params.opacity * activeGlitch})`;
          ctx.fillRect(shift, y, width, h);

          // Draw Blue channel
          ctx.fillStyle = `rgba(0, 0, ${b}, ${params.opacity * activeGlitch})`;
          ctx.fillRect(shiftB, y, width, h);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
