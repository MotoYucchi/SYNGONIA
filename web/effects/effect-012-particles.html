<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "particleCount", "label": "密度", "type": "range", "min": 100, "max": 10000, "step": 100, "default": 2000 },
      { "id": "baseSize", "label": "基本サイズ", "type": "range", "min": 1, "max": 100, "step": 1, "default": 10 },
      { "id": "color1", "label": "色 1", "type": "color", "default": "#00ff66" },
      { "id": "color2", "label": "色 2", "type": "color", "default": "#ff0066" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
      { "id": "reactLow", "label": "低音 -> サイズ爆発", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 2.0 },
      { "id": "reactMid", "label": "中音 -> 色スイッチ", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.5 },
      { "id": "speed", "label": "移動速度", "type": "range", "min": 0, "max": 10, "step": 0.1, "default": 1.0 },
      { "id": "shape", "label": "形状", "type": "select", "options": ["Circle", "Square", "Diamond"], "default": "Circle" }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height, cx, cy;
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { particleCount: 2000, baseSize: 10, color1: "#00ff66", color2: "#ff0066", opacity: 1.0, reactLow: 2.0, reactMid: 0.5, speed: 1.0, shape: "Circle" };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    
    let particles = [];
    function initParticles() {
      particles = [];
      for(let i=0; i<params.particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          type: Math.random() > 0.5 ? 1 : 2,
          offset: Math.random() * Math.PI * 2
        });
      }
    }
    initParticles();

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }
    function calculateModColor(layerHex, gRgb) {
      const lRgb = hexToRgb(layerHex);
      return `rgba(${(lRgb.r + gRgb.r)%256}, ${(lRgb.g + gRgb.g)%256}, ${(lRgb.b + gRgb.b)%256}, ${params.opacity})`;
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color1', 'color2', 'shape'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
        
        if (msg.paramId === 'particleCount') initParticles();
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    let time = 0;
    function render() {
      if (!isVisible) { isAnimating = false; return; }
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i=20; i<=30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      
      time += 0.05 * params.speed;

      ctx.clearRect(0, 0, width, height);

      const c1 = calculateModColor(params.color1, groupColorRgb);
      const c2 = calculateModColor(params.color2, groupColorRgb);
      
      const isSwitched = mid > params.reactMid;
      const sizeMultiplier = 1 + (bass * params.reactLow * 5);

      particles.forEach(p => {
        p.x += p.vx * params.speed * (1 + bass * 2);
        p.y += p.vy * params.speed * (1 + bass * 2);
        
        // Wrap around
        if(p.x < 0) p.x = width; if(p.x > width) p.x = 0;
        if(p.y < 0) p.y = height; if(p.y > height) p.y = 0;

        const pulse = Math.sin(time + p.offset) * 0.5 + 0.5;
        const size = params.baseSize * pulse * sizeMultiplier;
        
        ctx.fillStyle = (p.type === 1) ? (isSwitched ? c2 : c1) : (isSwitched ? c1 : c2);
        
        ctx.beginPath();
        if (params.shape === "Circle") {
          ctx.arc(p.x, p.y, size, 0, Math.PI*2);
        } else if (params.shape === "Square") {
          ctx.rect(p.x - size, p.y - size, size*2, size*2);
        } else if (params.shape === "Diamond") {
          ctx.moveTo(p.x, p.y - size);
          ctx.lineTo(p.x + size, p.y);
          ctx.lineTo(p.x, p.y + size);
          ctx.lineTo(p.x - size, p.y);
        }
        ctx.fill();
      });

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
