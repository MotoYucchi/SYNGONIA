<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "b2bMode", "label": "B2B Mode", "type": "select", "options": ["Left", "Right", "Center"], "default": "Left" },
      { "id": "complexity", "label": "複雑度", "type": "range", "min": 2, "max": 6, "step": 1, "default": 4 },
      { "id": "color", "label": "色", "type": "color", "default": "#00ff88" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.5 },
      { "id": "speed", "label": "回転速度", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.0 },
      { "id": "reactMid", "label": "中音反応", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 2.0 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let params = { b2bMode: "Left", complexity: 4, color: "#00ff88", opacity: 0.5, speed: 1.0, reactMid: 2.0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color', 'b2bMode'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function drawBranch(len, depth, maxDepth, angleOffset) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -len);
      ctx.stroke();
      ctx.translate(0, -len);
      
      if (depth < maxDepth) {
        ctx.save();
        ctx.rotate(angleOffset);
        drawBranch(len * 0.7, depth + 1, maxDepth, angleOffset);
        ctx.restore();
        
        ctx.save();
        ctx.rotate(-angleOffset);
        drawBranch(len * 0.7, depth + 1, maxDepth, angleOffset);
        ctx.restore();
      }
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      let midSum = 0;
      for (let i = 20; i < 60; i++) midSum += currentFFT[i];
      const mid = (midSum / 40) / 255.0 || 0;
      
      time += params.speed * 0.01 + (mid * params.reactMid * 0.05);

      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = "screen";
      
      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${params.opacity})`;
      ctx.lineWidth = 1 + mid * 2;

      const cx = params.b2bMode === "Left" ? width*0.2 : (params.b2bMode === "Right" ? width*0.8 : width/2);
      const cy = height/2;
      
      ctx.save();
      ctx.translate(cx, cy);
      
      const angle = Math.sin(time) * Math.PI / 4 + Math.PI / 6;
      for (let i = 0; i < 6; i++) {
        ctx.rotate(Math.PI * 2 / 6 + time*0.1);
        drawBranch(height/5 + mid * 100, 1, params.complexity, angle);
      }
      ctx.restore();

      // B2B Mask
      if (params.b2bMode !== "Center") {
        ctx.globalCompositeOperation = "destination-in";
        const maskCx = width / 2;
        const sign = params.b2bMode === "Left" ? -1 : 1;
        const fadeWidth = 350;
        
        ctx.beginPath();
        if (params.b2bMode === "Left") ctx.rect(0, 0, maskCx - fadeWidth/2, height);
        else ctx.rect(maskCx + fadeWidth/2, 0, width, height);
        ctx.fillStyle = "rgba(255,255,255,1)";
        ctx.fill();

        for(let y=0; y<height; y+=10) {
          const wave = Math.sin(y*0.01 + time*2) * 50; 
          const maskGrad = ctx.createLinearGradient(maskCx + wave, 0, maskCx + wave + (fadeWidth * sign), 0);
          maskGrad.addColorStop(0, "rgba(255,255,255,1)");
          maskGrad.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = maskGrad;
          ctx.fillRect(maskCx - fadeWidth - 100, y, fadeWidth*2 + 200, 11);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
