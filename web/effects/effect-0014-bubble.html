<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {
            "id": "complexity",
            "label": "万華鏡の数",
            "type": "range",
            "min": 2,
            "max": 12,
            "step": 1,
            "default": 6
      },
      {
            "id": "particleCount",
            "label": "シャボン玉の数",
            "type": "range",
            "min": 10,
            "max": 200,
            "step": 1,
            "default": 100
      },
      {
            "id": "opacity",
            "label": "透明度(全体)",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 0.8
      },
      {
            "id": "afterimage",
            "label": "残像の強さ",
            "type": "range",
            "min": 0,
            "max": 0.99,
            "step": 0.01,
            "default": 0.5
      },
      {
            "id": "color1",
            "label": "色1",
            "type": "color",
            "default": "#ff00ff"
      },
      {
            "id": "color2",
            "label": "色2",
            "type": "color",
            "default": "#00ffff"
      },
      {
            "id": "color3",
            "label": "色3",
            "type": "color",
            "default": "#ffff00"
      },
      {
            "id": "pattern",
            "label": "アニメーション",
            "type": "select",
            "options": [
                  "湧き出る",
                  "浮遊"
            ],
            "default": "湧き出る"
      },
      {
            "id": "speed",
            "label": "回転スピード",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "highReact",
            "label": "高音 -> ぴかぴか",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.5
      },
      {
            "id": "midReact",
            "label": "中音 -> 色/回転",
            "type": "range",
            "min": 0,
            "max": 10,
            "step": 0.1,
            "default": 2.0
      },
      {
            "id": "lowReact",
            "label": "低音 -> サイズ",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.5
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      }
]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, cx, cy;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { complexity: 6, particleCount: 100, opacity: 0.8, afterimage: 0.5, color1: "#ff00ff", color2: "#00ffff", color3: "#ffff00", pattern: "湧き出る", speed: 1.0, highReact: 1.5, midReact: 2.0, lowReact: 1.5, hueSource: "None", hueAmount: 90 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    let particles = [];

    // --- 色合成 (effect-0000-circle.html 準拠) ---
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    }

    // HEXカラーをRGBオブジェクトに変換し、Group色とModulo Mathで合成
    function calculateModColorRgb(layerHex, gRgb) {
      const lRgb = hexToRgb(layerHex);
      const r = (lRgb.r + gRgb.r) % 256;
      const g = (lRgb.g + gRgb.g) % 256;
      const b = (lRgb.b + gRgb.b) % 256;
      return { r, g, b };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color1', 'color2', 'color3', 'pattern', 'hueSource'].includes(msg.paramId)) {
          params[msg.paramId] = msg.value;
        } else {
          params[msg.paramId] = Number(msg.value);
        }
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    function createParticle() {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 2 + 1;
      const colorId = Math.floor(Math.random() * 3); // color1, color2, color3からランダム

      let startX = cx;
      let startY = cy;
      let vx = Math.cos(angle) * speed;
      let vy = Math.sin(angle) * speed;

      if (params.pattern === "浮遊") {
        startX = Math.random() * width;
        startY = Math.random() * height;
        vx = (Math.random() - 0.5) * speed;
        vy = (Math.random() - 0.5) * speed;
      }

      return {
        x: startX,
        y: startY,
        vx: vx,
        vy: vy,
        size: Math.random() * 20 + 5,
        colorId: colorId,
        life: 1.0,
        death: Math.random() * 0.01 + 0.005,
        alphaOffset: Math.random() * 10
      };
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // 1. FFT解析
      const low = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;
      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = 'hue-rotate(' + _hueDeg + 'deg)';
      else canvas.style.filter = '';

      time += params.speed * 0.02;
      ctx.clearRect(0, 0, width, height); // 透過要件のため、残像はCanvasを消去せず薄い黒で塗りつぶすことで実装

      // 残像処理
      ctx.fillStyle = `rgba(0, 0, 0, ${1 - params.afterimage})`;
      ctx.fillRect(0, 0, width, height);

      // パーティクルの追加と更新
      if (particles.length < params.particleCount && Math.random() < 0.2) particles.push(createParticle());
      particles = particles.filter(p => p.life > 0);

      const slices = params.complexity;
      const midRotation = mid * params.midReact;
      const currentOpacity = params.opacity;

      // 2. 描画ロジック
      ctx.save();
      
      // ポップなサイズ変化（低音）
      const s = 1 + (low * params.lowReact * 0.5);
      
      // 画面全体にMidで色相変化を適用（「ぴかぴか色がわって」）
      ctx.filter = `hue-rotate(${mid * params.midReact * 36}deg)`;

      ctx.translate(cx, cy);
      ctx.scale(s, s);
      ctx.rotate(time * 0.1 + midRotation * 0.01);

      for (let i = 0; i < slices; i++) {
        ctx.save();
        ctx.rotate((i * Math.PI * 2) / slices);
        if (i % 2 === 0) ctx.scale(1, -1);

        particles.forEach(p => {
          p.life -= p.death;
          p.x += p.vx * (1 + low * 2);
          p.y += p.vy * (1 + low * 2);

          // ポップなサイズ変化（低音）
          const currentSize = p.size * (1 + low * params.lowReact);
          
          // ぴかぴか透明度変化（高音）
          const pOpacity = p.life * currentOpacity * (0.8 + Math.sin(time * 10 + p.alphaOffset) * 0.2 * high * params.highReact);

          // 透過シャボン玉の描画
          const currentHex = params[`color${p.colorId + 1}`];
          const modRgb = calculateModColorRgb(currentHex, groupColorRgb);
          const grad = ctx.createRadialGradient(p.x - cx, p.y - cy, 0, p.x - cx, p.y - cy, currentSize);
          grad.addColorStop(0, `rgba(${modRgb.r}, ${modRgb.g}, ${modRgb.b}, ${pOpacity})`);
          grad.addColorStop(1, `rgba(${modRgb.r}, ${modRgb.g}, ${modRgb.b}, 0)`);
          
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x - cx, p.y - cy, currentSize, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }
      ctx.restore();

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
