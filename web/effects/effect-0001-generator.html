<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {
            "id": "shape",
            "label": "Shape",
            "type": "select",
            "options": [
                  "Particle",
                  "Starfield",
                  "Tunnel",
                  "Lissajous",
                  "Grid"
            ],
            "default": "Particle"
      },
      {
            "id": "speed",
            "label": "Speed",
            "type": "range",
            "min": -5,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "opacity",
            "label": "Opacity",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 1.0
      },
      {
            "id": "color",
            "label": "Color",
            "type": "color",
            "default": "#00ffff"
      },
      {
            "id": "thickness",
            "label": "Line Thickness",
            "type": "range",
            "min": 1,
            "max": 50,
            "step": 1,
            "default": 2
      },
      {
            "id": "beatAnim",
            "label": "Beat Animation",
            "type": "select",
            "options": [
                  "None",
                  "Scale",
                  "Flash",
                  "Shake"
            ],
            "default": "None"
      },
      {
            "id": "reactLow",
            "label": "Low React (Bass)",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "reactMid",
            "label": "Mid React",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "reactHigh",
            "label": "High React",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      },
      {
            "id": "shiftX",
            "label": "Shift X",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      },
      {
            "id": "shiftY",
            "label": "Shift Y",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      }
]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    
    let width, height, cx, cy;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2;
      cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { shape: "Particle", speed: 1.0, opacity: 1.0, color: "#00ffff", beatAnim: "None", reactLow: 1.0, reactMid: 1.0, reactHigh: 1.0, hueSource: "None", hueAmount: 90, shiftX: 0, shiftY: 0, thickness: 2 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;

    // --- 色計算 ---
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }
    function calculateModColor(layerHex, gRgb) {
      const lRgb = hexToRgb(layerHex);
      return `rgba(${(lRgb.r + gRgb.r)%256}, ${(lRgb.g + gRgb.g)%256}, ${(lRgb.b + gRgb.b)%256}, ${params.opacity})`;
    }

    // --- メッセージ受信 ---
    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        // 文字列として扱うパラメータと数値を分ける
        if (['color', 'shape', 'beatAnim', 'hueSource'].includes(msg.paramId)) {
          params[msg.paramId] = msg.value;
        } else {
          params[msg.paramId] = Number(msg.value);
        }
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    // --- エフェクト状態変数 ---
    let particles = [];
    let stars = Array.from({length: 200}, () => ({ x: Math.random()*2000-1000, y: Math.random()*2000-1000, z: Math.random()*1000 }));

    // --- 描画ループ ---
    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // 1. 帯域ごとのFFT解析
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;
      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = 'hue-rotate(' + _hueDeg + 'deg)';
      else canvas.style.filter = '';

      time += params.speed * 0.02;
      const drawColor = calculateModColor(params.color, groupColorRgb);

      ctx.clearRect(0, 0, width, height);

      // --- Beat Animation 処理 ---
      ctx.save();
      let animScale = 1;
      if (params.beatAnim === "Scale") animScale = 1 + (bass * params.reactLow * 0.5);
      if (params.beatAnim === "Shake") ctx.translate((Math.random()-0.5)*bass*50, (Math.random()-0.5)*bass*50);
      
      const shiftOffsetX = (params.shiftX || 0) / 100 * cx;
      const shiftOffsetY = (params.shiftY || 0) / 100 * cy;
      ctx.translate(cx + shiftOffsetX, cy + shiftOffsetY);
      ctx.scale(animScale, animScale);

      // --- Shape別の描画ロジック ---
      ctx.strokeStyle = drawColor;
      ctx.fillStyle = drawColor;

      switch(params.shape) {
        case "Particle":
          // 音に合わせてパーティクル生成
          if (bass > 0.5 && particles.length < 300) {
            for(let i=0; i<3; i++) {
              const angle = Math.random() * Math.PI * 2;
              const speed = (Math.random() * 5 + 2) * (1 + bass * params.reactLow);
              particles.push({ x: 0, y: 0, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1.0 });
            }
          }
          particles.forEach((p, i) => {
            p.x += p.vx * params.speed;
            p.y += p.vy * params.speed;
            p.life -= 0.01;
            ctx.globalAlpha = p.life * params.opacity;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 + (high * params.reactHigh * 20), 0, Math.PI*2);
            ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
          });
          break;

        case "Starfield":
          const speedZ = params.speed * (2 + bass * params.reactLow * 20);
          stars.forEach(s => {
            s.z -= speedZ;
            if(s.z <= 0) { s.z = 1000; s.x = Math.random()*2000-1000; s.y = Math.random()*2000-1000; }
            const px = (s.x / s.z) * cx;
            const py = (s.y / s.z) * cy;
            const size = (1 - s.z / 1000) * 3 + (high * params.reactHigh * 5);
            ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI*2); ctx.fill();
          });
          break;

        case "Tunnel":
          ctx.lineWidth = params.thickness + (high * params.reactHigh * 10);
          for(let i=0; i<15; i++) {
            const rad = ((time * 50 + i * 50) % 800) * (1 + bass * params.reactLow * 0.2);
            ctx.globalAlpha = (1 - rad/800) * params.opacity;
            ctx.beginPath();
            const sides = 6; 
            const offset = time * params.speed + (mid * params.reactMid * 2);
            for(let j=0; j<=sides; j++) {
              const a = (j/sides) * Math.PI*2 + offset;
              j === 0 ? ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad) : ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
            }
            ctx.stroke();
          }
          break;

        case "Lissajous":
          ctx.lineWidth = params.thickness + (high * params.reactHigh * 5);
          ctx.beginPath();
          const freqA = 3 + (bass * params.reactLow * 2);
          const freqB = 2 + (mid * params.reactMid * 2);
          for(let i=0; i<=Math.PI*2; i+=0.05) {
            const lx = Math.sin(freqA * i + time) * (cx * 0.8);
            const ly = Math.sin(freqB * i) * (cy * 0.8);
            i===0 ? ctx.moveTo(lx, ly) : ctx.lineTo(lx, ly);
          }
          ctx.stroke();
          break;
          
        case "Grid":
          ctx.lineWidth = params.thickness + (high * params.reactHigh * 5);
          const horizonY = 50;
          const lines = 20;
          ctx.translate(0, horizonY);
          // 横線
          for(let i=1; i<lines; i++) {
            const depth = ((i * 10 - time * 50 * params.speed) % 200 + 200) % 200;
            const gy = (1 / depth) * cy * 20;
            ctx.globalAlpha = Math.min(1, (gy / cy)) * params.opacity;
            ctx.beginPath(); ctx.moveTo(-cx, gy); ctx.lineTo(cx, gy); ctx.stroke();
          }
          // 縦線
          ctx.globalAlpha = params.opacity;
          for(let i=-10; i<=10; i++) {
            const gx = i * 100 * (1 + bass * params.reactLow * 0.5);
            ctx.beginPath(); ctx.moveTo(gx/200, 0); ctx.lineTo(gx, cy); ctx.stroke();
          }
          break;
      }
      ctx.restore();

      // Flashアニメーション (画面全体)
      if (params.beatAnim === "Flash" && bass > 0.6) {
        ctx.fillStyle = `rgba(255, 255, 255, ${bass * params.reactLow * 0.5})`;
        ctx.fillRect(0, 0, width, height);
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
