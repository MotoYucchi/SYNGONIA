<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "rayCount", "label": "光線数", "type": "range", "min": 8, "max": 120, "step": 1, "default": 40 },
    { "id": "rayLength", "label": "光線長さ", "type": "range", "min": 50, "max": 800, "step": 1, "default": 300 },
    { "id": "thickness", "label": "線の太さ", "type": "range", "min": 0.5, "max": 15, "step": 0.5, "default": 2.5 },
    { "id": "rotSpeed", "label": "回転速度", "type": "range", "min": 0, "max": 5, "step": 0.05, "default": 0.8 },
    { "id": "spread", "label": "広がり", "type": "range", "min": 0.1, "max": 2, "step": 0.05, "default": 1.0 },
    { "id": "sizeReact", "label": "サイズ反応", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5 },
    { "id": "colorReactLow", "label": "Low→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 120 },
    { "id": "colorReactMid", "label": "Mid→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 60 },
    { "id": "colorReactHigh", "label": "High→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 30 },
    { "id": "smoothing", "label": "スムージング", "type": "range", "min": 0.05, "max": 0.5, "step": 0.01, "default": 0.15 },
    { "id": "color", "label": "ベース色", "type": "color", "default": "#ff00ff" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
}
window.addEventListener('resize', resize);
resize();

let params = {
  rayCount: 40, rayLength: 300, thickness: 2.5, rotSpeed: 0.8,
  spread: 1.0, sizeReact: 1.5,
  colorReactLow: 120, colorReactMid: 60, colorReactHigh: 30,
  smoothing: 0.15, color: '#ff00ff', opacity: 1.0,
  shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let time = 0;

// スムージング＆差分検出用
let smoothLow = 0, smoothMid = 0, smoothHigh = 0;
let prevLow = 0, prevMid = 0, prevHigh = 0;

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 0, b: 255 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color'].includes(msg.paramId) ? msg.value : Number(msg.value);
  } else if (msg.type === 'audio_data' && msg.fft) {
    currentFFT = msg.fft;
  } else if (msg.type === 'group_update') {
    groupColorRgb = hexToRgb(msg.color);
  }
});

// --- FFT帯域取得 ---
function getLow() {
  let sum = 0;
  for (let i = 0; i <= 10; i++) sum += currentFFT[i];
  return (sum / 11) / 255;
}
function getMid() {
  let sum = 0;
  for (let i = 20; i <= 60; i++) sum += currentFFT[i];
  return (sum / 41) / 255;
}
function getHigh() {
  let sum = 0;
  for (let i = 100; i <= 200; i++) sum += currentFFT[i];
  return (sum / 101) / 255;
}

// --- HSL→RGB ---
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(1, s));
  l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; }
  else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; }
  else { r = c; b = x; }
  return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawLow = getLow();
  const rawMid = getMid();
  const rawHigh = getHigh();

  // スムージング
  const sm = params.smoothing;
  smoothLow += (rawLow - smoothLow) * sm;
  smoothMid += (rawMid - smoothMid) * sm;
  smoothHigh += (rawHigh - smoothHigh) * sm;

  // 差分検出（爆音対策）
  const deltaLow = Math.abs(rawLow - prevLow);
  const deltaMid = Math.abs(rawMid - prevMid);
  const deltaHigh = Math.abs(rawHigh - prevHigh);
  prevLow = rawLow; prevMid = rawMid; prevHigh = rawHigh;

  time += 0.016;
  ctx.clearRect(0, 0, width, height);

  // カラー計算
  const lRgb = hexToRgb(params.color);
  const baseR = Math.min(255, lRgb.r + groupColorRgb.r);
  const baseG = Math.min(255, lRgb.g + groupColorRgb.g);
  const baseB = Math.min(255, lRgb.b + groupColorRgb.b);

  // HSL変換してhue-shiftを帯域ごとに適用
  const baseHue = (Math.atan2(baseB - 128, baseR - 128) * 180 / Math.PI + 360) % 360;

  const shiftX = (params.shiftX / 100) * cx;
  const shiftY = (params.shiftY / 100) * cy;

  ctx.save();
  ctx.translate(cx + shiftX, cy + shiftY);

  const rayCount = Math.floor(params.rayCount + smoothHigh * 40);
  const baseLen = params.rayLength;
  const lengthBoost = smoothLow * baseLen * params.sizeReact;
  const rotBase = time * params.rotSpeed * (1 + smoothMid * 2);

  for (let i = 0; i < rayCount; i++) {
    const angle = (i / rayCount) * Math.PI * 2 * params.spread + rotBase;
    const rayNoise = Math.sin(time * 3 + i * 0.7) * 0.15;
    const len = (baseLen + lengthBoost) * (1 + rayNoise);

    // 各光線に帯域ベースのHueシフト
    const hue = baseHue
      + smoothLow * params.colorReactLow
      + deltaMid * params.colorReactMid * 3
      + deltaHigh * params.colorReactHigh * 5
      + i * (360 / rayCount) * 0.3;
    const sat = 0.8 + smoothMid * 0.2;
    const lit = 0.4 + smoothHigh * 0.3 + deltaLow * 0.3;
    const rgb = hslToRgb(hue, sat, lit);

    const alpha = params.opacity * (0.5 + smoothLow * 0.5);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len);
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.lineWidth = params.thickness * (1 + deltaLow * 3);
    ctx.stroke();

    // ハイハット反応: 先端フラッシュ
    if (smoothHigh > 0.3) {
      const tipSize = 3 + deltaHigh * 15;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * len, Math.sin(angle) * len, tipSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${deltaHigh * 2})`;
      ctx.fill();
    }
  }

  // 中心グロー
  const glowR = 30 + smoothLow * 80;
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
  const glowRgb = hslToRgb(baseHue + smoothLow * params.colorReactLow, 0.9, 0.6);
  grad.addColorStop(0, `rgba(${glowRgb.r},${glowRgb.g},${glowRgb.b},${0.6 * params.opacity})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(-glowR, -glowR, glowR * 2, glowR * 2);

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
