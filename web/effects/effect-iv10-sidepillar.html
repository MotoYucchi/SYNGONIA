<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "pillarCount", "label": "柱の数", "type": "range", "min": 2, "max": 16, "step": 1, "default": 6 },
    { "id": "maxWidth", "label": "最大幅%", "type": "range", "min": 10, "max": 45, "step": 1, "default": 30 },
    { "id": "gapRatio", "label": "間隔比", "type": "range", "min": 0.1, "max": 2.0, "step": 0.1, "default": 0.8 },
    { "id": "sparkAmount", "label": "スパーク量", "type": "range", "min": 0, "max": 30, "step": 1, "default": 10 },
    { "id": "sizeReact", "label": "サイズ反応", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5 },
    { "id": "colorReactLow", "label": "Low→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 120 },
    { "id": "colorReactMid", "label": "Mid→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 60 },
    { "id": "colorReactHigh", "label": "High→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 30 },
    { "id": "smoothing", "label": "スムージング", "type": "range", "min": 0.05, "max": 0.5, "step": 0.01, "default": 0.15 },
    { "id": "color", "label": "ベース色", "type": "color", "default": "#00ffcc" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let params = {
  pillarCount: 6, maxWidth: 30, gapRatio: 0.8, sparkAmount: 10,
  sizeReact: 1.5,
  colorReactLow: 120, colorReactMid: 60, colorReactHigh: 30,
  smoothing: 0.15, color: '#00ffcc', opacity: 1.0,
  shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let time = 0;
let smoothLow = 0, smoothMid = 0, smoothHigh = 0;
let prevLow = 0, prevMid = 0, prevHigh = 0;

// スパークパーティクル配列
let sparks = [];

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 255, b: 204 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color'].includes(msg.paramId) ? msg.value : Number(msg.value);
  } else if (msg.type === 'audio_data' && msg.fft) {
    currentFFT = msg.fft;
  } else if (msg.type === 'group_update') {
    groupColorRgb = hexToRgb(msg.color);
  }
});

function getLow() { let s = 0; for (let i = 0; i <= 10; i++) s += currentFFT[i]; return (s / 11) / 255; }
function getMid() { let s = 0; for (let i = 20; i <= 60; i++) s += currentFFT[i]; return (s / 41) / 255; }
function getHigh() { let s = 0; for (let i = 100; i <= 200; i++) s += currentFFT[i]; return (s / 101) / 255; }

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawLow = getLow();
  const rawMid = getMid();
  const rawHigh = getHigh();

  const sm = params.smoothing;
  smoothLow += (rawLow - smoothLow) * sm;
  smoothMid += (rawMid - smoothMid) * sm;
  smoothHigh += (rawHigh - smoothHigh) * sm;

  const deltaLow = Math.abs(rawLow - prevLow);
  const deltaMid = Math.abs(rawMid - prevMid);
  const deltaHigh = Math.abs(rawHigh - prevHigh);
  prevLow = rawLow; prevMid = rawMid; prevHigh = rawHigh;

  time += 0.016;
  ctx.clearRect(0, 0, width, height);

  const lRgb = hexToRgb(params.color);
  const baseR = Math.min(255, lRgb.r + groupColorRgb.r);
  const baseG = Math.min(255, lRgb.g + groupColorRgb.g);
  const baseB = Math.min(255, lRgb.b + groupColorRgb.b);
  const baseHue = (Math.atan2(baseB - 128, baseR - 128) * 180 / Math.PI + 360) % 360;

  const shiftXPx = (params.shiftX / 100) * (width / 2);
  const shiftYPx = (params.shiftY / 100) * (height / 2);

  ctx.save();
  ctx.translate(shiftXPx, shiftYPx);

  const maxPx = width * (params.maxWidth / 100);
  const pillarCount = Math.floor(params.pillarCount);
  const totalSlots = pillarCount + (pillarCount - 1) * params.gapRatio;
  const pillarH = height / totalSlots;
  const gapH = pillarH * params.gapRatio;

  // 柱の伸び（Low反応、ドカドカ同期）
  const extend = maxPx * Math.min(1, smoothLow * params.sizeReact * (0.5 + deltaLow * 2));

  for (let pi = 0; pi < pillarCount; pi++) {
    const py = pi * (pillarH + gapH);
    const hue = baseHue
      + smoothMid * params.colorReactMid
      + deltaMid * params.colorReactMid * 3
      + deltaHigh * params.colorReactHigh * 5
      + pi * 20;
    const sat = 0.8 + smoothMid * 0.2;
    const lit = 0.4 + smoothLow * 0.3 + deltaLow * 0.3;
    const rgb = hslToRgb(hue, sat, lit);
    const alpha = params.opacity * (0.4 + smoothLow * 0.6);

    // 柱の幅に個体差（微妙なずれ）
    const noise = Math.sin(time * 2 + pi * 1.5) * 0.1 + 1;
    const pw = extend * noise;

    // 左の柱
    const gradL = ctx.createLinearGradient(0, py, pw, py);
    gradL.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`);
    gradL.addColorStop(0.7, `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.4})`);
    gradL.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
    ctx.fillStyle = gradL;
    ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.shadowBlur = 8 + smoothLow * 12;
    ctx.fillRect(0, py, pw, pillarH);

    // 右の柱
    const gradR = ctx.createLinearGradient(width, py, width - pw, py);
    gradR.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`);
    gradR.addColorStop(0.7, `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.4})`);
    gradR.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
    ctx.fillStyle = gradR;
    ctx.fillRect(width - pw, py, pw, pillarH);

    // フラッシュ（deltaLow反応）
    if (deltaLow > 0.1) {
      const flashAlpha = Math.min(0.6, deltaLow * 2) * params.opacity;
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.shadowBlur = 0;
      ctx.fillRect(0, py, pw * 0.3, pillarH);
      ctx.fillRect(width - pw * 0.3, py, pw * 0.3, pillarH);
    }

    // スパーク生成（High反応）
    if (smoothHigh > 0.2 && params.sparkAmount > 0) {
      const spawnCount = Math.floor(deltaHigh * params.sparkAmount * 0.5);
      for (let s = 0; s < spawnCount; s++) {
        const sparkY = py + Math.random() * pillarH;
        // 左側スパーク
        sparks.push({
          x: pw, y: sparkY,
          vx: 1 + Math.random() * 3, vy: (Math.random() - 0.5) * 2,
          alpha: 0.8 + Math.random() * 0.2, size: 1.5 + Math.random() * 2,
          r: rgb.r, g: rgb.g, b: rgb.b
        });
        // 右側スパーク
        sparks.push({
          x: width - pw, y: sparkY,
          vx: -(1 + Math.random() * 3), vy: (Math.random() - 0.5) * 2,
          alpha: 0.8 + Math.random() * 0.2, size: 1.5 + Math.random() * 2,
          r: rgb.r, g: rgb.g, b: rgb.b
        });
      }
    }
  }

  // スパーク更新＆描画
  ctx.shadowBlur = 0;
  for (let i = sparks.length - 1; i >= 0; i--) {
    const sp = sparks[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.alpha *= 0.94;
    sp.size *= 0.97;

    if (sp.alpha < 0.02 || sp.size < 0.3) {
      sparks.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${sp.r},${sp.g},${sp.b},${sp.alpha * params.opacity})`;
    ctx.fill();
  }

  // メモリ制限
  if (sparks.length > 500) sparks.length = 500;

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
