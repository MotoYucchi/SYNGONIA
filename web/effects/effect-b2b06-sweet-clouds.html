<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "b2bMode", "label": "B2B Mode", "type": "select", "options": ["Left", "Right", "Center"], "default": "Left" },
      { "id": "cloudCount", "label": "雲の数", "type": "range", "min": 5, "max": 50, "step": 1, "default": 15 },
      { "id": "color", "label": "色", "type": "color", "default": "#ffb6c1" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.6 },
      { "id": "speed", "label": "流れる速度", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.0 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let params = { b2bMode: "Left", cloudCount: 15, color: "#ffb6c1", opacity: 0.6, speed: 1.0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;
    
    let clouds = [];

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color', 'b2bMode'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function spawnCloud() {
      const isLeft = params.b2bMode === "Left" || (params.b2bMode === "Center" && Math.random() > 0.5);
      const bx = isLeft ? Math.random() * (width/2) : width/2 + Math.random() * (width/2);
      clouds.push({
        x: bx,
        y: Math.random() * height,
        r: 50 + Math.random() * 150,
        vx: (Math.random() - 0.5) * params.speed,
        vy: (Math.random() - 0.5) * params.speed
      });
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      time += 0.02;
      
      if (clouds.length < params.cloudCount && Math.random() < 0.1) spawnCloud();

      ctx.clearRect(0, 0, width, height);
      
      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);

      ctx.globalCompositeOperation = "screen";
      ctx.filter = "blur(30px)"; // Fluffy clouds
      
      clouds.forEach((c, i) => {
        c.x += c.vx;
        c.y += c.vy;
        c.y += Math.sin(time + i) * 0.5; // gentle float
        
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
        
        const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${params.opacity})`);
        grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
        
        ctx.fillStyle = grad;
        ctx.fill();

        if (c.x < -200 || c.x > width+200 || c.y < -200 || c.y > height+200) {
          clouds.splice(i, 1);
        }
      });
      ctx.filter = "none";
      ctx.globalCompositeOperation = "source-over";

      // B2B Mask
      if (params.b2bMode !== "Center") {
        ctx.globalCompositeOperation = "destination-in";
        const cx = width / 2;
        const sign = params.b2bMode === "Left" ? -1 : 1;
        const fadeWidth = 500; // Very soft blend for clouds
        
        ctx.beginPath();
        if (params.b2bMode === "Left") ctx.rect(0, 0, cx - fadeWidth/2, height);
        else ctx.rect(cx + fadeWidth/2, 0, width, height);
        ctx.fillStyle = "rgba(255,255,255,1)";
        ctx.fill();

        for(let y=0; y<height; y+=20) {
          const wave = Math.sin(y*0.002 + time) * 150; 
          const maskGrad = ctx.createLinearGradient(cx + wave, 0, cx + wave + (fadeWidth * sign), 0);
          maskGrad.addColorStop(0, "rgba(255,255,255,1)");
          maskGrad.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = maskGrad;
          ctx.fillRect(cx - fadeWidth - 200, y, fadeWidth*2 + 400, 25);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
