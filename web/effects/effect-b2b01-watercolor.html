<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "b2bMode", "label": "B2B Mode", "type": "select", "options": ["Left", "Right", "Center"], "default": "Left" },
      { "id": "blurAmount", "label": "滲み具合", "type": "range", "min": 10, "max": 200, "step": 10, "default": 100 },
      { "id": "color", "label": "色", "type": "color", "default": "#00aaff" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.8 },
      { "id": "speed", "label": "流動速度", "type": "range", "min": 0, "max": 10, "step": 0.1, "default": 2.0 },
      { "id": "reactLow", "label": "低音反応", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.5 }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { b2bMode: "Left", blurAmount: 100, color: "#00aaff", opacity: 0.8, speed: 2.0, reactLow: 1.5 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let time = 0;

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color', 'b2bMode'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    // blobs
    const blobs = [];
    for(let i=0; i<10; i++) {
      blobs.push({ x: Math.random()*2 - 1, y: Math.random()*2 - 1, s: Math.random()*0.5 + 0.5, a: Math.random()*Math.PI*2 });
    }

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      time += 0.01 * params.speed;
      const bass = (currentFFT[1] + currentFFT[2]) / 2 / 255.0 || 0;
      
      // Draw background blobs
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, width, height);
      
      const lRgb = hexToRgb(params.color);
      const r = Math.min(255, lRgb.r + groupColorRgb.r);
      const g = Math.min(255, lRgb.g + groupColorRgb.g);
      const b = Math.min(255, lRgb.b + groupColorRgb.b);
      
      // Use blur for watercolor effect
      ctx.filter = `blur(${params.blurAmount * (1 + bass * params.reactLow)}px)`;
      
      blobs.forEach((blob, i) => {
        blob.a += 0.02 * params.speed * (i%2==0?1:-1);
        const bx = width/2 + Math.cos(blob.a + time) * width/2 * blob.x;
        const by = height/2 + Math.sin(blob.a + time) * height/2 * blob.y;
        
        ctx.beginPath();
        ctx.arc(bx, by, width/3 * blob.s * (1 + bass * params.reactLow * 0.5), 0, Math.PI*2);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${params.opacity})`;
        ctx.fill();
      });
      ctx.filter = "none";

      // Apply B2B Mask (Soft Edge)
      if (params.b2bMode !== "Center") {
        ctx.globalCompositeOperation = "destination-in";
        ctx.beginPath();
        
        // Draw jagged/organic mask boundary
        let cx = width / 2;
        let sign = params.b2bMode === "Left" ? -1 : 1;
        
        // Solid side
        if (params.b2bMode === "Left") {
          ctx.rect(0, 0, cx, height);
        } else {
          ctx.rect(cx, 0, width, height);
        }
        ctx.fill();

        // Jagged boundary mix
        for(let y=0; y<height; y+=20) {
          const wave = Math.sin(y*0.01 + time*5) * 50 + Math.cos(y*0.02 - time*3) * 50;
          const maskGrad = ctx.createLinearGradient(cx + wave, 0, cx + wave + (200 * sign), 0);
          maskGrad.addColorStop(0, "rgba(255,255,255,1)");
          maskGrad.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = maskGrad;
          ctx.fillRect(cx - 200, y, 400, 25);
        }
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
