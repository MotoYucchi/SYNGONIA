<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "bassFreqLow", "label": "Bass Freq Low", "type": "range", "min": 0, "max": 50, "step": 1, "default": 0 },
    { "id": "bassFreqHigh", "label": "Bass Freq High", "type": "range", "min": 1, "max": 80, "step": 1, "default": 10 },
    { "id": "bassThreshold", "label": "Bass Threshold", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.15 },
    { "id": "bassSense", "label": "Bass Sensitivity", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.5 },
    { "id": "particleCount", "label": "Particle Count", "type": "range", "min": 5, "max": 80, "step": 1, "default": 30 },
    { "id": "gravity", "label": "Gravity", "type": "range", "min": 0.05, "max": 1, "step": 0.01, "default": 0.3 },
    { "id": "launchPower", "label": "Launch Power", "type": "range", "min": 2, "max": 30, "step": 0.5, "default": 12 },
    { "id": "particleSize", "label": "Particle Size", "type": "range", "min": 1, "max": 15, "step": 0.5, "default": 4 },
    { "id": "afterimage", "label": "Afterimage", "type": "range", "min": 0, "max": 0.99, "step": 0.01, "default": 0.85 },
    { "id": "cooldown", "label": "Cooldown (ms)", "type": "range", "min": 30, "max": 500, "step": 10, "default": 100 },
    { "id": "color", "label": "Base Color", "type": "color", "default": "#ff6600" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "hueSource", "label": "Hue Band", "type": "select", "options": ["None", "Low", "Mid", "High"], "default": "None" },
    { "id": "hueAmount", "label": "Hue Amount", "type": "range", "min": -360, "max": 360, "step": 1, "default": 90 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; cx = width/2; cy = height/2; }
window.addEventListener('resize', resize); resize();

let params = {
  bassFreqLow: 0, bassFreqHigh: 10, bassThreshold: 0.15, bassSense: 1.5,
  particleCount: 30, gravity: 0.3, launchPower: 12, particleSize: 4,
  afterimage: 0.85, cooldown: 100,
  color: '#ff6600', opacity: 1.0,
  hueSource: 'None', hueAmount: 90, shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let particles = [], lastHitTime = 0, prevBelow = true;

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : { r:255,g:102,b:0 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color','hueSource'].includes(msg.paramId) ? msg.value : Number(msg.value);
  } else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
  else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
});

function getBass() {
  const lo = Math.max(0, params.bassFreqLow), hi = Math.min(511, params.bassFreqHigh);
  if (hi <= lo) return 0;
  let s = 0; for (let i = lo; i <= hi; i++) s += currentFFT[i];
  return (s / (hi - lo + 1)) / 255;
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawBass = getBass();
  const now = performance.now();

  // ヒット検出
  const isAbove = rawBass > params.bassThreshold;
  if (isAbove && prevBelow && (now - lastHitTime) > params.cooldown) {
    const power = params.launchPower * (0.5 + rawBass * params.bassSense);
    for (let i = 0; i < params.particleCount; i++) {
      const angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI * 0.8;
      const speed = power * (0.5 + Math.random() * 0.5);
      particles.push({
        x: cx + (Math.random() - 0.5) * 100,
        y: height,
        vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 3,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        size: params.particleSize * (0.5 + Math.random())
      });
    }
    lastHitTime = now;
  }
  prevBelow = !isAbove;

  // Afterimage
  if (params.afterimage > 0) {
    ctx.fillStyle = `rgba(0,0,0,${1 - params.afterimage})`;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'source-over';
  } else {
    ctx.clearRect(0, 0, width, height);
  }

  // Hue
  let hv = 0;
  if (params.hueSource === 'Low') hv = rawBass;
  else if (params.hueSource === 'Mid') { let s=0; for(let i=20;i<=30;i++) s+=currentFFT[i]; hv=s/11/255; }
  else if (params.hueSource === 'High') { let s=0; for(let i=100;i<=120;i++) s+=currentFFT[i]; hv=s/21/255; }
  canvas.style.filter = hv ? `hue-rotate(${hv*params.hueAmount}deg)` : '';

  const lRgb = hexToRgb(params.color);
  const r = Math.min(255, lRgb.r+groupColorRgb.r), g = Math.min(255, lRgb.g+groupColorRgb.g), b = Math.min(255, lRgb.b+groupColorRgb.b);

  ctx.save();
  ctx.translate((params.shiftX||0)/100*cx, (params.shiftY||0)/100*cy);

  // パーティクル更新・描画
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += params.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.008;

    if (p.life <= 0 || p.y > height + 50) {
      particles.splice(i, 1);
      continue;
    }

    ctx.fillStyle = `rgba(${r},${g},${b},${p.life * params.opacity})`;
    ctx.shadowColor = `rgba(${r},${g},${b},${p.life * 0.5})`;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }

  // パーティクル数制限
  if (particles.length > 500) particles.splice(0, particles.length - 500);

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
