<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      { "id": "dotCount", "label": "ドット数", "type": "range", "min": 10, "max": 1000, "step": 10, "default": 100 },
      { "id": "dotSize", "label": "ドットサイズ", "type": "range", "min": 1, "max": 50, "step": 1, "default": 5 },
      { "id": "color", "label": "色", "type": "color", "default": "#00ffff" },
      { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
      { "id": "amplitude", "label": "振幅 (Amplitude)", "type": "range", "min": 0, "max": 1000, "step": 10, "default": 200 },
      { "id": "frequency", "label": "周波数", "type": "range", "min": 0.1, "max": 20.0, "step": 0.1, "default": 2.0 },
      { "id": "reactLow", "label": "低音 -> 振幅スイッチ", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.5 },
      { "id": "speed", "label": "流れる速度", "type": "range", "min": 0, "max": 10, "step": 0.1, "default": 2.0 },
      { "id": "style", "label": "描画スタイル", "type": "select", "options": ["Dots", "Lines", "Filled"], "default": "Dots" }
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height, cx, cy;
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = { dotCount: 100, dotSize: 5, color: "#00ffff", opacity: 1.0, amplitude: 200, frequency: 2.0, reactLow: 1.5, speed: 2.0, style: "Dots" };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }
    function calculateModColor(layerHex, gRgb) {
      const lRgb = hexToRgb(layerHex);
      return `rgba(${(lRgb.r + gRgb.r)%256}, ${(lRgb.g + gRgb.g)%256}, ${(lRgb.b + gRgb.b)%256}, ${params.opacity})`;
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (['color', 'style'].includes(msg.paramId)) params[msg.paramId] = msg.value;
        else params[msg.paramId] = Number(msg.value);
      } 
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    let time = 0;
    function render() {
      if (!isVisible) { isAnimating = false; return; }
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      
      time += 0.05 * params.speed;

      ctx.clearRect(0, 0, width, height);

      const drawColor = calculateModColor(params.color, groupColorRgb);
      ctx.fillStyle = drawColor;
      ctx.strokeStyle = drawColor;
      ctx.lineWidth = params.dotSize;

      // Audio reactive amplitude
      let currentAmp = params.amplitude * (1 + bass * params.reactLow);
      
      ctx.beginPath();
      for(let i=0; i<=params.dotCount; i++) {
        const x = (i / params.dotCount) * width;
        const phase = (x / width) * Math.PI * 2 * params.frequency + time;
        const y = cy + Math.sin(phase) * currentAmp;

        if (params.style === "Dots") {
          ctx.beginPath();
          ctx.arc(x, y, params.dotSize, 0, Math.PI*2);
          ctx.fill();
        } else if (params.style === "Lines") {
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        } else if (params.style === "Filled") {
          if (i === 0) ctx.moveTo(x, cy);
          ctx.lineTo(x, y);
        }
      }
      
      if (params.style === "Lines") ctx.stroke();
      if (params.style === "Filled") {
        ctx.lineTo(width, cy);
        ctx.closePath();
        ctx.fill();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
