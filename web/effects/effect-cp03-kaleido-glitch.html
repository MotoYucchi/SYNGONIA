<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script id="vj-schema" type="application/json">
    [
      {"id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0},
      {"id": "scale", "label": "Scale", "type": "range", "min": 0.1, "max": 3, "step": 0.1, "default": 1.0},
      {"id": "speed", "label": "Speed", "type": "range", "min": -5, "max": 5, "step": 0.1, "default": 1.0},
      {"id": "segments", "label": "Segments", "type": "range", "min": 4, "max": 16, "step": 2, "default": 8},
      {"id": "mirrorMode", "label": "Mirror", "type": "select", "options": ["None", "Horizontal", "Vertical", "Cross"], "default": "Cross"},
      {"id": "glitchAmount", "label": "Glitch Amount", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 0.35},
      {"id": "sliceCount", "label": "Slice Count", "type": "range", "min": 2, "max": 20, "step": 1, "default": 8},
      {"id": "rgbShift", "label": "RGB Separation", "type": "range", "min": 0, "max": 1, "step": 0.05, "default": 0.4},
      {"id": "rotation", "label": "Rotation", "type": "range", "min": 0, "max": 360, "step": 1, "default": 0},
      {"id": "color", "label": "Color", "type": "color", "default": "#ffffff"},
      {"id": "audioGain", "label": "Audio Gain", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.0}
    ]
  </script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width = 1920, height = 1080, cx = 960, cy = 540;

    // スライスグリッチ用中間バッファ
    const tileCanvas = document.createElement('canvas');
    const tileCtx = tileCanvas.getContext('2d', { alpha: true });

    function resize() {
      width = canvas.width = tileCanvas.width = Math.max(1, window.innerWidth || 1920);
      height = canvas.height = tileCanvas.height = Math.max(1, window.innerHeight || 1080);
      cx = width / 2;
      cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    let params = {
      opacity: 1.0,
      scale: 1.0,
      speed: 1.0,
      segments: 8,
      mirrorMode: "Cross",
      glitchAmount: 0.35,
      sliceCount: 8,
      rgbShift: 0.4,
      rotation: 0,
      color: "#ffffff",
      audioGain: 1.0
    };

    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let isVisible = true;
    let isAnimating = true;
    let time = 0;

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    function calculateModColor(layerHex, gRgb, alpha = params.opacity) {
      const lRgb = hexToRgb(layerHex || "#ffffff");
      const r = (lRgb.r + (gRgb ? gRgb.r : 0)) % 256;
      const g = (lRgb.g + (gRgb ? gRgb.g : 0)) % 256;
      const b = (lRgb.b + (gRgb ? gRgb.b : 0)) % 256;
      const safeAlpha = Math.max(0, Math.min(1, isNaN(alpha) ? 1.0 : Number(alpha)));
      return `rgba(${r}, ${g}, ${b}, ${safeAlpha})`;
    }

    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg.type === 'visibility') {
        isVisible = !!msg.visible;
        if (isVisible && !isAnimating) {
          isAnimating = true;
          requestAnimationFrame(render);
        }
        return;
      }
      if (msg.type === 'param_update') {
        if (['color', 'mirrorMode'].includes(msg.paramId)) {
          params[msg.paramId] = msg.value;
        } else {
          params[msg.paramId] = Number(msg.value);
        }
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    // ── Copy 1 (Cathedral Gothic Base Generator) ──
    function drawCathedralPattern(c, bass, mid, high) {
      c.save();
      c.translate(cx, cy);
      const rad = Math.min(width, height) * 0.38 * (1.0 + bass * 0.25);
      
      c.beginPath();
      c.arc(0, 0, rad, 0, Math.PI * 2);
      c.arc(0, 0, rad * 0.65, 0, Math.PI * 2);
      c.arc(0, 0, rad * 0.3, 0, Math.PI * 2);
      c.stroke();

      // ゴシック尖頭アーチ
      const arches = 12;
      for (let i = 0; i < arches; i++) {
        const a = (i / arches) * Math.PI * 2;
        c.save();
        c.rotate(a);
        c.beginPath();
        c.moveTo(0, rad * 0.3);
        c.lineTo(rad * 0.18, rad * 0.7);
        c.lineTo(0, rad);
        c.lineTo(-rad * 0.18, rad * 0.7);
        c.closePath();
        c.stroke();
        c.restore();
      }
      c.restore();
    }

    function render() {
      if (!isVisible) {
        isAnimating = false;
        return;
      }

      if (width <= 1 || height <= 1) {
        resize();
        if (width <= 1 || height <= 1) {
          requestAnimationFrame(render);
          return;
        }
      }

      // Audio analysis
      const bass = ((currentFFT[1] + currentFFT[2] + currentFFT[3] + currentFFT[4]) / 4 / 255.0 || 0) * (params.audioGain || 1.0);
      let midSum = 0; for (let i = 15; i <= 40; i++) midSum += currentFFT[i];
      const mid = ((midSum / 26) / 255.0 || 0) * (params.audioGain || 1.0);
      let highSum = 0; for (let i = 80; i <= 140; i++) highSum += currentFFT[i];
      const high = ((highSum / 61) / 255.0 || 0) * (params.audioGain || 1.0);

      time += (params.speed !== undefined ? params.speed : 1.0) * 0.02;

      // ── Copy 1 & 2: カテドラル幾何学パターンを中間バッファに万華鏡描画 ──
      tileCtx.clearRect(0, 0, width, height);
      tileCtx.save();
      tileCtx.translate(cx, cy);

      if (params.rotation) {
        tileCtx.rotate((params.rotation * Math.PI) / 180);
      }
      tileCtx.rotate(time * 0.3);

      const segs = Math.max(4, Math.min(16, Math.floor(params.segments || 8)));
      const stepAngle = (Math.PI * 2) / segs;
      tileCtx.lineWidth = 2 + high * 4;
      tileCtx.strokeStyle = calculateModColor(params.color, groupColorRgb, params.opacity);

      // Copy 2 (Radial Kaleidoscope Symmetry)
      for (let s = 0; s < segs; s++) {
        tileCtx.save();
        tileCtx.rotate(s * stepAngle);
        if (s % 2 === 1) tileCtx.scale(1, -1);
        tileCtx.translate(-cx, -cy);
        drawCathedralPattern(tileCtx, bass, mid, high);
        tileCtx.restore();
      }
      tileCtx.restore();

      // ── Copy 3〜5: メインキャンバスへのミラー・スライスグリッチ・RGB分離合成 ──
      ctx.save();
      ctx.clearRect(0, 0, width, height);

      const scl = params.scale || 1.0;
      ctx.translate(cx, cy);
      ctx.scale(scl, scl);
      ctx.translate(-cx, -cy);

      // Copy 3: クロスミラー
      const mirror = params.mirrorMode || "Cross";
      const mPasses = (mirror === "Cross") ? 2 : (mirror === "Horizontal" || mirror === "Vertical" ? 2 : 1);

      for (let mp = 0; mp < mPasses; mp++) {
        ctx.save();
        if (mirror === "Horizontal" && mp === 1) {
          ctx.translate(width, 0); ctx.scale(-1, 1);
        } else if (mirror === "Vertical" && mp === 1) {
          ctx.translate(0, height); ctx.scale(1, -1);
        } else if (mirror === "Cross" && mp === 1) {
          ctx.translate(width, height); ctx.scale(-1, -1);
        }

        // Copy 4: スライスグリッチ (高周波・ビート時に水平矩形カット・オフセット)
        const glitchActive = (params.glitchAmount || 0.35) * (1.0 + high * 2.0);
        const slices = Math.max(2, Math.floor(params.sliceCount || 8));
        const sliceH = height / slices;

        // Copy 5: RGB Separation 描画
        const shift = (params.rgbShift || 0.4) * (6 + high * 20);

        for (let i = 0; i < slices; i++) {
          const sy = i * sliceH;
          let offX = 0;
          if (Math.random() < glitchActive * 0.4) {
            offX = (Math.random() - 0.5) * 60 * glitchActive;
          }

          if (shift > 0.5 && Math.random() < 0.6) {
            // 赤色分離
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.drawImage(tileCanvas, 0, sy, width, sliceH, offX - shift, sy, width, sliceH);
            // シアン分離
            ctx.drawImage(tileCanvas, 0, sy, width, sliceH, offX + shift, sy, width, sliceH);
            ctx.restore();
          }

          // 通常描画
          ctx.drawImage(tileCanvas, 0, sy, width, sliceH, offX, sy, width, sliceH);
        }

        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
