<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    /* 必須：背景透過とレイアウト固定 */
    body { 
      margin: 0; 
      overflow: hidden; 
      background: transparent; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      width: 100vw;
    }
    #canvas-container { position: relative; }
    /* FFT等の高速描画のためCSS transitionは原則禁止 */
    .vj-element { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="vj-root"></div>

  <script id="vj-schema" type="application/json">
    [
      { "id": "size", "label": "基本サイズ", "type": "range", "min": 10, "max": 1000, "step": 1, "default": 200, "midi": "Knob1-1" },
      { "id": "thickness", "label": "線の太さ", "type": "range", "min": 1, "max": 200, "step": 1, "default": 10, "midi": "Knob2-1" },
      { "id": "audioSense", "label": "音反応感度", "type": "range", "min": 0, "max": 5, "step": 0.1, "default": 1.0, "midi": "Fader1-1" },
      { "id": "shapeMode", "label": "形状切替", "type": "select", "options": ["Circle", "Square", "Star"], "default": "Circle", "midi": "Pad1" }
    ]
  </script>

  <script>
    // --- システム標準変数 ---
    let params = {
      size: 200, thickness: 10, audioSense: 1.0, shapeMode: 'Circle',
      baseR: 0, baseG: 255, baseB: 255, baseA: 1.0 // 標準装備のRGBA
    };
    let groupColor = { r: 0, g: 0, b: 0 }; 
    let fftData = new Uint8Array(512);
    let isVisible = true;
    let isAnimating = false;

    // --- C案：SharedArrayBuffer 対応 (実装されている場合) ---
    // 親側で SharedArrayBuffer が生成されている場合、メモリを直接参照します。
    let sharedFFT = null;

    // --- メッセージ受信処理 ---
    window.addEventListener('message', (e) => {
      const msg = e.data;

      switch(msg.type) {
        case 'visibility':
          isVisible = !!msg.visible;
          if (isVisible && !isAnimating) {
            isAnimating = true;
            requestAnimationFrame(update);
          }
          break;

        case 'param_update':
          // 型変換の自動化
          params[msg.paramId] = isNaN(msg.value) ? msg.value : Number(msg.value);
          break;
        
        case 'group_update':
          // グループ色（Modulo合成用）の更新
          groupColor = hexToRgb(msg.color);
          break;

        case 'audio_data':
          // A案：バイナリ転送対応。ArrayならUint8Arrayへ、ArrayBufferならそのまま。
          if (msg.fft instanceof ArrayBuffer) {
            fftData = new Uint8Array(msg.fft);
          } else {
            fftData = new Uint8Array(msg.fft);
          }
          break;
        
        case 'setup_shared_mem':
          // C案：メモリ共有設定
          sharedFFT = new Uint8Array(msg.buffer);
          break;
      }
    });

    // --- ヘルパー：Modulo Math カラー合成 ---
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return { r, g, b };
    }

    function getMixedColor() {
      // (レイヤーRGB + グループRGB) mod 256 + レイヤーAlpha
      const r = (params.baseR + groupColor.r) % 256;
      const g = (params.baseG + groupColor.g) % 256;
      const b = (params.baseB + groupColor.b) % 256;
      return `rgba(${r}, ${g}, ${b}, ${params.baseA})`;
    }

    // --- メイン描画ループ ---
    const root = document.getElementById('vj-root');
    
    function update() {
      if (!isVisible) {
        isAnimating = false;
        return;
      }
      isAnimating = true;

      // SharedArrayBufferがあればそちらを優先（超低レイテンシ）
      const data = sharedFFT || fftData;

      // FFT解析（代表的な3帯域）
      const low = data[2] / 255.0;
      const mid = data[25] / 255.0;
      const high = data[100] / 255.0;

      // 反応計算
      const dynamicSize = params.size + (low * 200 * params.audioSense);
      const dynamicWeight = params.thickness + (high * 50 * params.audioSense);
      
      // DOM更新（またはCanvas描画）
      root.style.width = `${dynamicSize}px`;
      root.style.height = `${dynamicSize}px`;
      root.style.border = `${dynamicWeight}px solid ${getMixedColor()}`;
      root.style.borderRadius = params.shapeMode === 'Circle' ? '50%' : '0%';
      root.style.transform = `rotate(${mid * 360}deg)`;

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
