<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vj-schema" type="application/json">
  [
    { "id": "gridSize", "label": "グリッドサイズ", "type": "range", "min": 20, "max": 120, "step": 1, "default": 50 },
    { "id": "cellGap", "label": "セル間隔", "type": "range", "min": 0, "max": 10, "step": 0.5, "default": 2 },
    { "id": "pulseDecay", "label": "パルス減衰", "type": "range", "min": 0.8, "max": 0.99, "step": 0.01, "default": 0.92 },
    { "id": "sizeReact", "label": "サイズ反応", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5 },
    { "id": "colorReactLow", "label": "Low→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 120 },
    { "id": "colorReactMid", "label": "Mid→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 60 },
    { "id": "colorReactHigh", "label": "High→色相", "type": "range", "min": 0, "max": 360, "step": 1, "default": 30 },
    { "id": "smoothing", "label": "スムージング", "type": "range", "min": 0.05, "max": 0.5, "step": 0.01, "default": 0.15 },
    { "id": "color", "label": "ベース色", "type": "color", "default": "#00ffcc" },
    { "id": "opacity", "label": "Opacity", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
    { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
    { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
  ]
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;
let hexCells = [];

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  buildGrid();
}
window.addEventListener('resize', resize);

let params = {
  gridSize: 50, cellGap: 2, pulseDecay: 0.92, sizeReact: 1.5,
  colorReactLow: 120, colorReactMid: 60, colorReactHigh: 30,
  smoothing: 0.15, color: '#00ffcc', opacity: 1.0,
  shiftX: 0, shiftY: 0,
  baseR: 0, baseG: 255, baseB: 255, baseA: 1.0
};
let currentFFT = new Array(512).fill(0);
let groupColorRgb = { r: 0, g: 0, b: 0 };
let time = 0;
let smoothLow = 0, smoothMid = 0, smoothHigh = 0;
let prevLow = 0, prevMid = 0, prevHigh = 0;

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 255, b: 204 };
}


    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
  const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
  if (msg.type === 'param_update') {
    if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
    params[msg.paramId] = ['color'].includes(msg.paramId) ? msg.value : Number(msg.value);
    if (msg.paramId === 'gridSize') buildGrid();
  } else if (msg.type === 'audio_data' && msg.fft) {
    currentFFT = msg.fft;
  } else if (msg.type === 'group_update') {
    groupColorRgb = hexToRgb(msg.color);
  }
});

function buildGrid() {
  hexCells = [];
  const s = params.gridSize;
  const h = s * Math.sqrt(3);
  const cols = Math.ceil(width / (s * 1.5)) + 2;
  const rows = Math.ceil(height / h) + 2;
  const offsetX = -s;
  const offsetY = -h / 2;
  for (let col = 0; col < cols; col++) {
    for (let row = 0; row < rows; row++) {
      const x = offsetX + col * s * 1.5;
      const y = offsetY + row * h + (col % 2 === 1 ? h / 2 : 0);
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      hexCells.push({
        x, y, dist,
        zone: dist < maxDist * 0.33 ? 0 : dist < maxDist * 0.66 ? 1 : 2,
        energy: 0, hueOffset: (col * 13 + row * 7) % 360
      });
    }
  }
}
resize();

function getLow() { let s = 0; for (let i = 0; i <= 10; i++) s += currentFFT[i]; return (s / 11) / 255; }
function getMid() { let s = 0; for (let i = 20; i <= 60; i++) s += currentFFT[i]; return (s / 41) / 255; }
function getHigh() { let s = 0; for (let i = 100; i <= 200; i++) s += currentFFT[i]; return (s / 101) / 255; }

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
}

function drawHex(x, y, size) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 3 * i - Math.PI / 6;
    const px = x + size * Math.cos(angle);
    const py = y + size * Math.sin(angle);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function render() {
      if (!isVisible) { isAnimating = false; return; }
  const rawLow = getLow();
  const rawMid = getMid();
  const rawHigh = getHigh();

  const sm = params.smoothing;
  smoothLow += (rawLow - smoothLow) * sm;
  smoothMid += (rawMid - smoothMid) * sm;
  smoothHigh += (rawHigh - smoothHigh) * sm;

  const deltaLow = Math.abs(rawLow - prevLow);
  const deltaMid = Math.abs(rawMid - prevMid);
  const deltaHigh = Math.abs(rawHigh - prevHigh);
  prevLow = rawLow; prevMid = rawMid; prevHigh = rawHigh;

  time += 0.016;
  ctx.clearRect(0, 0, width, height);

  const lRgb = hexToRgb(params.color);
  const baseR = Math.min(255, lRgb.r + groupColorRgb.r);
  const baseG = Math.min(255, lRgb.g + groupColorRgb.g);
  const baseB = Math.min(255, lRgb.b + groupColorRgb.b);
  const baseHue = (Math.atan2(baseB - 128, baseR - 128) * 180 / Math.PI + 360) % 360;

  const shiftXPx = (params.shiftX / 100) * cx;
  const shiftYPx = (params.shiftY / 100) * cy;

  ctx.save();
  ctx.translate(shiftXPx, shiftYPx);

  const s = params.gridSize;
  const gap = params.cellGap;
  const drawSize = (s - gap) * 0.5;

  for (let i = 0; i < hexCells.length; i++) {
    const cell = hexCells[i];

    // 帯域ごとのエネルギー注入
    let inject = 0;
    if (cell.zone === 0) inject = smoothLow * params.sizeReact + deltaLow * 2;
    else if (cell.zone === 1) inject = smoothMid * params.sizeReact * 0.8 + deltaMid * 1.5;
    else inject = smoothHigh * params.sizeReact * 0.6 + deltaHigh * 3;

    // 波状伝播
    const wave = Math.sin(time * 4 - cell.dist * 0.01) * 0.3;
    inject += Math.max(0, wave) * smoothLow;

    cell.energy = Math.max(inject, cell.energy * params.pulseDecay);

    if (cell.energy < 0.02) continue; // 描画スキップ

    // サイズ変動
    const cellSize = drawSize * (1 + cell.energy * 0.5);

    // 色相：帯域ごとのシフト
    const hue = baseHue + cell.hueOffset * 0.3
      + smoothLow * params.colorReactLow
      + deltaMid * params.colorReactMid * 3
      + deltaHigh * params.colorReactHigh * 5;
    const sat = 0.7 + cell.energy * 0.3;
    const lit = 0.2 + cell.energy * 0.5;
    const rgb = hslToRgb(hue, sat, lit);

    const alpha = Math.min(1, cell.energy) * params.opacity;

    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    drawHex(cell.x, cell.y, cellSize);
    ctx.fill();

    // グロー
    if (cell.energy > 0.5) {
      ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.5})`;
      ctx.shadowBlur = cell.energy * 15;
      drawHex(cell.x, cell.y, cellSize);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
