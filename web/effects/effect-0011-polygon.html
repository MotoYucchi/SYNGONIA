<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; overflow: hidden; background: transparent; }</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script id="vj-schema" type="application/json">
    [
      {
            "id": "baseSize",
            "label": "基本サイズ",
            "type": "range",
            "min": 10,
            "max": 500,
            "step": 1,
            "default": 150
      },
      {
            "id": "baseThick",
            "label": "基本の太さ",
            "type": "range",
            "min": 1,
            "max": 50,
            "step": 1,
            "default": 2
      },
      {
            "id": "opacity",
            "label": "透明度",
            "type": "range",
            "min": 0,
            "max": 1,
            "step": 0.01,
            "default": 0.8
      },
      {
            "id": "color",
            "label": "ベース色",
            "type": "color",
            "default": "#ffffff"
      },
      {
            "id": "lowSize",
            "label": "低音 -> サイズ",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 1.0
      },
      {
            "id": "lowHue",
            "label": "低音 -> 色相",
            "type": "range",
            "min": 0,
            "max": 360,
            "step": 1,
            "default": 0
      },
      {
            "id": "lowThick",
            "label": "低音 -> 太さ",
            "type": "range",
            "min": 0,
            "max": 50,
            "step": 1,
            "default": 10
      },
      {
            "id": "midSize",
            "label": "中音 -> サイズ",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 0.5
      },
      {
            "id": "midHue",
            "label": "中音 -> 色相",
            "type": "range",
            "min": 0,
            "max": 360,
            "step": 1,
            "default": 90
      },
      {
            "id": "midThick",
            "label": "中音 -> 太さ",
            "type": "range",
            "min": 0,
            "max": 50,
            "step": 1,
            "default": 5
      },
      {
            "id": "highSize",
            "label": "高音 -> サイズ",
            "type": "range",
            "min": 0,
            "max": 5,
            "step": 0.1,
            "default": 0.2
      },
      {
            "id": "highHue",
            "label": "高音 -> 色相",
            "type": "range",
            "min": 0,
            "max": 360,
            "step": 1,
            "default": 180
      },
      {
            "id": "highThick",
            "label": "高音 -> 太さ",
            "type": "range",
            "min": 0,
            "max": 50,
            "step": 1,
            "default": 20
      },
      {
            "id": "subBass",
            "label": "超低音Factor",
            "type": "range",
            "min": 1,
            "max": 100,
            "step": 1,
            "default": 7
      },
      {
            "id": "ultraHigh",
            "label": "超高音Factor",
            "type": "range",
            "min": 1,
            "max": 100,
            "step": 1,
            "default": 9
      },
      {
            "id": "beatAnim",
            "label": "Beat Animation",
            "type": "select",
            "options": [
                  "なし",
                  "Pulse",
                  "Rotate",
                  "Glitch"
            ],
            "default": "なし"
      },
      {
            "id": "hueSource",
            "label": "Hue Band",
            "type": "select",
            "options": [
                  "None",
                  "Low",
                  "Mid",
                  "High"
            ],
            "default": "None"
      },
      {
            "id": "hueAmount",
            "label": "Hue Amount",
            "type": "range",
            "min": -360,
            "max": 360,
            "step": 1,
            "default": 90
      },
      {
            "id": "shiftX",
            "label": "Shift X",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      },
      {
            "id": "shiftY",
            "label": "Shift Y",
            "type": "range",
            "min": -100,
            "max": 100,
            "step": 1,
            "default": 0
      }
]
  </script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let params = { 
      baseSize: 150, baseThick: 2, opacity: 0.8, color: '#ffffff',
      lowSize: 1.0, lowHue: 0, lowThick: 10,
      midSize: 0.5, midHue: 90, midThick: 5,
      highSize: 0.2, highHue: 180, highThick: 20,
      subBass: 7, ultraHigh: 9, beatAnim: "なし", hueSource: "None", hueAmount: 90, shiftX: 0, shiftY: 0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    let beatValue = 0; // Beat Animation用

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
    }

    function calculateModColor(layerHex, gRgb, alpha, hueShift) {
      const lRgb = hexToRgb(layerHex);
      const r = (lRgb.r + gRgb.r) % 256;
      const g = (lRgb.g + gRgb.g) % 256;
      const b = (lRgb.b + gRgb.b) % 256;
      return `hsla(${(hueShift + 0)}, 100%, 50%, ${alpha})`; // 実際にはModuloカラーをベースに色相環を回す設計
      // 厳密なModulo Mathを維持しつつ色相変化を反映:
      // return `rgba(${r}, ${g}, ${b}, ${alpha})`; 
    }

    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        params[msg.paramId] = (msg.paramId === 'color' || msg.paramId === 'beatAnim' || msg.paramId === 'hueSource') ? msg.value : Number(msg.value);
      } else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      } else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      } else if (msg.type === 'beat') { // 外部からのBeat信号
        beatValue = 1.0;
      }
    });

    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // 1. FFT解析
      const low = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;
      // --- Audio Reactive Hue ---
      let _hueVal = 0;
      if (params.hueSource === 'Low') _hueVal = low;
      else if (params.hueSource === 'Mid') _hueVal = mid;
      else if (params.hueSource === 'High') _hueVal = high;
      const _hueDeg = _hueVal * params.hueAmount;
      if (_hueDeg !== 0) canvas.style.filter = 'hue-rotate(' + _hueDeg + 'deg)';
      else canvas.style.filter = '';

      // 2. パラメータ計算
      // 角数: (超低音パラメータ * 超高音パラメータ) mod 39 (最低3角形)
      const sides = Math.max(3, (params.subBass * params.ultraHigh) % 39);
      
      // Beat Animationの減衰
      beatValue *= 0.9; 
      const beatScale = (params.beatAnim === "Pulse") ? 1 + beatValue * 0.5 : 1;
      const beatRotate = (params.beatAnim === "Rotate") ? beatValue * Math.PI : 0;

      // 統合サイズ・太さ・色相
      const s = params.baseSize * (1 + low * params.lowSize + mid * params.midSize + high * params.highSize) * beatScale;
      const thick = params.baseThick + (low * params.lowThick + mid * params.midThick + high * params.highThick);
      const hShift = (low * params.lowHue + mid * params.midHue + high * params.highHue);

      // 3. 描画
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      const shiftOffsetX = (params.shiftX || 0) / 100 * (width / 2);
      const shiftOffsetY = (params.shiftY || 0) / 100 * (height / 2);
      ctx.translate(width/2 + shiftOffsetX, height/2 + shiftOffsetY);
      ctx.rotate(beatRotate + (params.beatAnim === "Glitch" ? (Math.random()-0.5)*beatValue : 0));
      
      const mixedRgb = hexToRgb(params.color);
      const r = Math.min(255, mixedRgb.r + groupColorRgb.r);
      const g = Math.min(255, mixedRgb.g + groupColorRgb.g);
      const b = Math.min(255, mixedRgb.b + groupColorRgb.b);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${params.opacity})`;
      ctx.lineWidth = thick;
      
      // 色相フィルタを適用（reactMidのように色を変化させる）
      ctx.filter = `hue-rotate(${hShift}deg)`;

      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const angle = (i * (360 / sides) - 90) * Math.PI / 180;
        ctx.lineTo(Math.cos(angle) * s, Math.sin(angle) * s);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
