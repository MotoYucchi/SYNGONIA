<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; }
    /* FFTの60fpsに直接追従させるため、transitionは外してレスポンスを速くします */
    #circle { border-radius: 50%; border-style: solid; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="circle"></div>

  <script id="vj-schema" type="application/json">
    [
      { "id": "size", "label": "基本サイズ", "type": "range", "min": 10, "max": 800, "step": 1, "default": 200 },
      { "id": "thickness", "label": "基本の太さ", "type": "range", "min": 1, "max": 100, "step": 1, "default": 5 },
      { "id": "color", "label": "ベース色", "type": "color", "default": "#00ffff" },
      { "id": "reactLow", "label": "低音反応 (サイズ増幅)", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.0 },
      { "id": "reactMid", "label": "中音反応 (色相変化)", "type": "range", "min": 0, "max": 360, "step": 1, "default": 90 },
      { "id": "reactHigh", "label": "高音反応 (線の太さ)", "type": "range", "min": 0, "max": 100, "step": 1, "default": 20 },
      { "id": "shiftX", "label": "Shift X", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 },
      { "id": "shiftY", "label": "Shift Y", "type": "range", "min": -100, "max": 100, "step": 1, "default": 0 }
    ]
  </script>

  <script>
    const circle = document.getElementById('circle');
    
    // 初期パラメータ
    let params = { size: 200, thickness: 5, color: '#00ffff', reactLow: 1.0, reactMid: 90, reactHigh: 20, shiftX: 0, shiftY: 0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 }; // 親グループの色

    // --- ヘルパー関数 ---
    // HEXカラー (#ffffff) を RGBオブジェクトに変換
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : { r: 0, g: 0, b: 0 };
    }

    // (Layer色 + Group色) mod 256 のアルゴリズム
    function calculateModColor(layerHex, gRgb) {
      const lRgb = hexToRgb(layerHex);
      const r = (lRgb.r + gRgb.r) % 256;
      const g = (lRgb.g + gRgb.g) % 256;
      const b = (lRgb.b + gRgb.b) % 256;
      return `rgb(${r}, ${g}, ${b})`;
    }

    // --- メッセージ受信 ---
    
    let isVisible = true;
    let isAnimating = true;

    window.addEventListener('message', (e) => {
      const msg = e.data;
    if (msg.type === 'visibility') {
      isVisible = !!msg.visible;
      if (isVisible && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(render);
      }
      return;
    }
      
      // 個別パラメータ更新
      if (msg.type === 'param_update') {
        if (msg.paramId === 'baseA') document.body.style.opacity = msg.value;
        if (msg.paramId === 'color') {
          params[msg.paramId] = msg.value;
        } else {
          params[msg.paramId] = Number(msg.value);
        }
      } 
      // 音声データ受信
      else if (msg.type === 'audio_data' && msg.fft) {
        currentFFT = msg.fft;
      }
      // グループカラー更新（第二フェーズの新機能）
      else if (msg.type === 'group_update') {
        groupColorRgb = hexToRgb(msg.color);
      }
    });

    // --- メインループ ---
    function render() {
      if (!isVisible) { isAnimating = false; return; }
      // 1. FFT解析（低・中・高域）
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      
      let midSum = 0;
      for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;

      let highSum = 0;
      for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;

      // 2. スタイル計算
      const scale = 1 + (bass * params.reactLow);
      const currentThickness = params.thickness + (high * params.reactHigh);
      const hueRotation = mid * params.reactMid;

      // ★ 第二フェーズ：Modulo Math による色合成
      const mixedColor = calculateModColor(params.color, groupColorRgb);

      const shiftOffsetX = (params.shiftX || 0) / 100 * (window.innerWidth / 2);
      const shiftOffsetY = (params.shiftY || 0) / 100 * (window.innerHeight / 2);
      
      // 3. DOM適用
      circle.style.width = `${params.size}px`;
      circle.style.height = `${params.size}px`;
      circle.style.borderColor = mixedColor; // 合成された色を適用
      circle.style.borderWidth = `${currentThickness}px`;
      circle.style.transform = `translate(${shiftOffsetX}px, ${shiftOffsetY}px) scale(${scale})`;
      circle.style.filter = `hue-rotate(${hueRotation}deg)`;

      requestAnimationFrame(render);
    }

    // 起動
    render();
  </script>
</body>
</html>
